<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuakeSignal Alert</title>
    <link rel="stylesheet" href="/src/alert.css" />
    <script type="module" src="/src/alert.ts" defer></script>
  </head>
  <body>
    <div
      id="alert"
      role="alertdialog"
      aria-modal="true"
      aria-atomic="true"
      aria-labelledby="badge hypocenter"
      aria-describedby="meta guidance tip"
    >
      <div>
        <span class="badge" id="badge"></span>
        <div class="hypocenter" id="hypocenter"></div>
        <div class="meta" id="meta"></div>
      </div>
      <div class="alert-guidance" id="guidance"></div>
      <div>
        <div class="tip" id="tip"></div>
        <div class="footer alert-footer">
          <button class="dismiss" id="dismiss"></button>
        </div>
      </div>
    </div>
  </body>
</html>
