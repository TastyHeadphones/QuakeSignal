[package]
name = "desktop"
version = "1.1.0"
description = "QuakeSignal Desktop — direct-to-Wolfx earthquake early warning alerts"
authors = ["UniSphereco LLC"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The Mac App Store build cannot use the legacy LaunchAgent implementation
# provided by tauri-plugin-autostart: it writes outside the App Sandbox.
macos-app-store = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde", "clock"] }
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
log = "0.4"
sys-locale = "0.3"
# Reuse the explicit Ring crypto provider installed by lib.rs instead of
# pulling a second TLS provider just for the bounded HTTPS recovery client.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
rodio = { version = "0.22.2", default-features = false, features = ["playback", "wav"] }
