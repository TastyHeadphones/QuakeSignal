name: QuakeSignal
options:
  bundleIdPrefix: com.quakesignal
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
    watchOS: "10.0"
    visionOS: "1.0"
  createIntermediateGroups: true
# Keep the public archive separate from the internal production QA build.
# `InternalQA` is release-optimised and production-signed, but only that
# configuration compiles the controlled delayed-training verification path.
configs:
  Debug: debug
  InternalQA: release
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "18"
targets:
  QuakeSignal:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    # Debug has a checked-in fail-closed default and an optional ignored local
    # override. The override is intentionally not available to Release.
    configFiles:
      Debug: QuakeSignal/Supporting/Debug.xcconfig
    sources:
      - path: QuakeSignal/App
      - path: QuakeSignal/Models
      - path: QuakeSignal/Networking
      - path: QuakeSignal/Notifications
      - path: QuakeSignal/State
      - path: QuakeSignal/Features
      - path: QuakeSignal/Resources
      - path: QuakeSignal/Assets.xcassets
      - path: QuakeSignalShared/AlertSoundPreference.swift
      - path: QuakeSignalShared/WatchAlertPreferenceBridge.swift
      - path: QuakeSignalShared/WatchForegroundEmergencyPolicy.swift
      - path: QuakeSignalShared/ScreenshotAutomation.swift
    dependencies:
      - target: QuakeSignalWatch
        embed: true
        platformFilter: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quakesignal.app
        DEVELOPMENT_TEAM: 5TT564H883
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        # The release owner selected the Swift-native Mac Catalyst product.
        # Do not also expose the unadapted iPhone/iPad binary on Apple-silicon
        # Macs; that would create two competing Mac experiences.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        "ENABLE_APP_SANDBOX[sdk=macosx*]": YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # Referenced directly (not via xcodegen's `info:`/`entitlements:` keys,
        # which treat the path as something *they* generate/own and will
        # silently overwrite a hand-written file with a bare-bones default).
        INFOPLIST_FILE: QuakeSignal/Supporting/Info.plist
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
          CODE_SIGN_ENTITLEMENTS: QuakeSignal/Supporting/QuakeSignal.entitlements
          "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": QuakeSignal/Supporting/QuakeSignal-Catalyst.entitlements
          # Enables only the explicit unsupported-service bypass used by local
          # development and Simulator builds. Supported physical devices still
          # run the real App Attest sandbox flow.
          QUAKESIGNAL_APP_ATTEST_MODE: development
        InternalQA:
          # Internal QA exercises the actual production trust boundary. It
          # deliberately keeps the public bundle ID, origin, and production
          # entitlements so a TestFlight result remains release-representative.
          CODE_SIGN_IDENTITY: Apple Distribution
          CODE_SIGN_ENTITLEMENTS: QuakeSignal/Supporting/QuakeSignal-Release.entitlements
          "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": QuakeSignal/Supporting/QuakeSignal-Catalyst.entitlements
          PROVISIONING_PROFILE_SPECIFIER: $(QUAKESIGNAL_IOS_PROFILE_NAME)
          "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": $(QUAKESIGNAL_CATALYST_PROFILE_NAME)
          QUAKESIGNAL_API_BASE_URL: https://quakesignal-api.hopeso.workers.dev
          QUAKESIGNAL_APP_ATTEST_MODE: production
          # Allow the hosted unit-test bundle to exercise the controlled wire
          # format. Public Release keeps Xcode's non-testable release default.
          ENABLE_TESTABILITY: YES
          # This is intentionally absent from the public Release archive.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) QUAKESIGNAL_INTERNAL_QA
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
          CODE_SIGN_ENTITLEMENTS: QuakeSignal/Supporting/QuakeSignal-Release.entitlements
          "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": QuakeSignal/Supporting/QuakeSignal-Catalyst.entitlements
          PROVISIONING_PROFILE_SPECIFIER: $(QUAKESIGNAL_IOS_PROFILE_NAME)
          "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": $(QUAKESIGNAL_CATALYST_PROFILE_NAME)
          # The user-approved public Cloudflare Workers hostname is the release
          # origin. The release workflow pins this exact URL before archiving.
          QUAKESIGNAL_API_BASE_URL: https://quakesignal-api.hopeso.workers.dev
          # Release code also hard-codes a fail-closed production policy, so a
          # copied Info.plist cannot turn on a bypass in a distributed build.
          QUAKESIGNAL_APP_ATTEST_MODE: production
  QuakeSignalVision:
    type: application
    platform: visionOS
    deploymentTarget: "1.0"
    configFiles:
      Debug: QuakeSignal/Supporting/Debug.xcconfig
    sources:
      - path: QuakeSignal/App
      - path: QuakeSignal/Models
      - path: QuakeSignal/Networking
      - path: QuakeSignal/Notifications
      - path: QuakeSignal/State
      - path: QuakeSignal/Features
      - path: QuakeSignal/Resources
        excludes:
          - PrivacyInfo.xcprivacy
      - path: QuakeSignal/Assets.xcassets
      - path: QuakeSignalVision/Assets.xcassets
      - path: QuakeSignalVision/Resources
      - path: QuakeSignalShared/AlertSoundPreference.swift
      - path: QuakeSignalShared/WatchAlertPreferenceBridge.swift
      - path: QuakeSignalShared/ScreenshotAutomation.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quakesignal.app
        DEVELOPMENT_TEAM: 5TT564H883
        TARGETED_DEVICE_FAMILY: "7"
        ASSETCATALOG_COMPILER_APPICON_NAME: VisionAppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: QuakeSignalVision/Supporting/Info.plist
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
          CODE_SIGN_ENTITLEMENTS: QuakeSignalVision/Supporting/QuakeSignalVision.entitlements
        InternalQA:
          CODE_SIGN_IDENTITY: Apple Distribution
          CODE_SIGN_ENTITLEMENTS: QuakeSignalVision/Supporting/QuakeSignalVision-Release.entitlements
          PROVISIONING_PROFILE_SPECIFIER: $(QUAKESIGNAL_VISION_PROFILE_NAME)
          ENABLE_TESTABILITY: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) QUAKESIGNAL_INTERNAL_QA
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
          CODE_SIGN_ENTITLEMENTS: QuakeSignalVision/Supporting/QuakeSignalVision-Release.entitlements
          PROVISIONING_PROFILE_SPECIFIER: $(QUAKESIGNAL_VISION_PROFILE_NAME)
  QuakeSignalTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: QuakeSignalTV/QuakeSignalTVApp.swift
      - path: QuakeSignalTV/TVDashboardView.swift
      - path: QuakeSignalTV/TVAlertPreferences.swift
      - path: QuakeSignalTV/TVAlertSoundSettingsView.swift
      - path: QuakeSignalTV/TVEmergencyAlertView.swift
      - path: QuakeSignalTV/TVEmergencyMonitor.swift
      - path: QuakeSignalTV/TVEmergencyPresentationPolicy.swift
      - path: QuakeSignalTV/TVUserInitiatedAlertAudio.swift
      - path: QuakeSignalShared/ForegroundQuakeStore.swift
      - path: QuakeSignalShared/ScreenshotAutomation.swift
      - path: QuakeSignal/App/Localization.swift
      - path: QuakeSignal/Models/EEWEvent.swift
      - path: QuakeSignal/Models/IntensityScale.swift
      - path: QuakeSignal/Networking/LiveSocketClient.swift
      - path: QuakeSignal/Networking/WolfxClient.swift
      - path: QuakeSignalShared/AlertSoundPreference.swift
      - path: QuakeSignal/Resources
        excludes:
          - Audio
          - PrivacyInfo.xcprivacy
      - path: QuakeSignal/Resources/Audio/quakesignal_urgent.caf
      - path: QuakeSignal/Resources/Audio/quakesignal_japanese_voice.caf
      - path: QuakeSignal/Resources/Audio/ATTRIBUTION.md
      - path: QuakeSignal/Assets.xcassets
      - path: QuakeSignalTV/Assets.xcassets
      - path: QuakeSignalTV/Supporting/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quakesignal.app
        DEVELOPMENT_TEAM: 5TT564H883
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: TVBrandAssets
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: QuakeSignalTV/Supporting/Info.plist
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
        InternalQA:
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(QUAKESIGNAL_TV_PROFILE_NAME)
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(QUAKESIGNAL_TV_PROFILE_NAME)
  QuakeSignalWatch:
    # Xcode 14+ single-target watch apps are executable watchOS application
    # products. `application.watchapp2` is the legacy stub container and must
    # not own Swift sources.
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: QuakeSignalWatch/QuakeSignalWatchApp.swift
      - path: QuakeSignalWatch/WatchDashboardView.swift
      - path: QuakeSignalWatch/WatchEmergencyAlertAudio.swift
      - path: QuakeSignalWatch/WatchForegroundEmergencyMonitor.swift
      - path: QuakeSignalShared/AlertSoundPreference.swift
      - path: QuakeSignalShared/ForegroundQuakeStore.swift
      - path: QuakeSignalShared/ScreenshotAutomation.swift
      - path: QuakeSignalShared/WatchAlertPreferenceBridge.swift
      - path: QuakeSignalShared/WatchForegroundEmergencyPolicy.swift
      - path: QuakeSignal/App/Localization.swift
      - path: QuakeSignal/Models/EEWEvent.swift
      - path: QuakeSignal/Models/IntensityScale.swift
      - path: QuakeSignal/Networking/ForegroundHTTPFallbackPolicy.swift
      - path: QuakeSignal/Networking/LiveSocketClient.swift
      - path: QuakeSignal/Networking/WolfxClient.swift
      - path: QuakeSignal/Resources
        excludes:
          - Audio
          - PrivacyInfo.xcprivacy
      - path: QuakeSignal/Resources/Audio/quakesignal_urgent.caf
      - path: QuakeSignal/Resources/Audio/quakesignal_japanese_voice.caf
      - path: QuakeSignal/Resources/Audio/ATTRIBUTION.md
      - path: QuakeSignal/Assets.xcassets
      - path: QuakeSignalWatch/Assets.xcassets
      - path: QuakeSignalWatch/Supporting/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quakesignal.app.watchkitapp
        DEVELOPMENT_TEAM: 5TT564H883
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: WatchAppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: QuakeSignalWatch/Supporting/Info.plist
        SKIP_INSTALL: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
        InternalQA:
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(QUAKESIGNAL_WATCH_PROFILE_NAME)
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(QUAKESIGNAL_WATCH_PROFILE_NAME)
  QuakeSignalTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: QuakeSignalTests
    dependencies:
      - target: QuakeSignal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quakesignal.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
      configs:
        # The wire-format test itself must compile with the same conditional
        # capability as its hosted InternalQA application target.
        InternalQA:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) QUAKESIGNAL_INTERNAL_QA
schemes:
  QuakeSignal:
    build:
      targets:
        QuakeSignal: all
    test:
      config: Debug
      targets:
        - QuakeSignalTests
    # Keep the ordinary Xcode archive action on the public configuration.
    archive:
      config: Release
  QuakeSignalVision:
    build:
      targets:
        QuakeSignalVision: all
    run:
      config: Debug
    archive:
      config: Release
  QuakeSignalTV:
    build:
      targets:
        QuakeSignalTV: all
    run:
      config: Debug
    archive:
      config: Release
  QuakeSignalWatch:
    build:
      targets:
        QuakeSignalWatch: all
    run:
      config: Debug
    archive:
      config: Release
