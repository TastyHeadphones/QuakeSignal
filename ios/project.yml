name: QuakeSignal
options:
  bundleIdPrefix: com.quakesignal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  QuakeSignal:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: QuakeSignal/App
      - path: QuakeSignal/Models
      - path: QuakeSignal/Networking
      - path: QuakeSignal/Notifications
      - path: QuakeSignal/State
      - path: QuakeSignal/Features
      - path: QuakeSignal/Resources
      - path: QuakeSignal/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quakesignal.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # Referenced directly (not via xcodegen's `info:`/`entitlements:` keys,
        # which treat the path as something *they* generate/own and will
        # silently overwrite a hand-written file with a bare-bones default).
        INFOPLIST_FILE: QuakeSignal/Supporting/Info.plist
        CODE_SIGN_ENTITLEMENTS: QuakeSignal/Supporting/QuakeSignal.entitlements
