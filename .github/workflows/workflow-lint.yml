name: Workflow lint

on:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
      - "packaging/homebrew-tap/**"
      - "desktop/src-tauri/src/lib.rs"
      - "ios/project.yml"
      - "ios/QuakeSignal.xcodeproj/project.pbxproj"
      - "ios/QuakeSignal.xcodeproj/xcshareddata/xcschemes/**"
      - "ios/QuakeSignal/Supporting/Info.plist"
      - "ios/QuakeSignalTV/Supporting/Info.plist"
      - "ios/QuakeSignalVision/Supporting/Info.plist"
      - "ios/QuakeSignalWatch/Supporting/Info.plist"
      - "ios/QuakeSignal/Supporting/QuakeSignal-Release.entitlements"
      - "ios/QuakeSignalVision/Supporting/QuakeSignalVision-Release.entitlements"
      - "ios/QuakeSignal/App/PlatformCapabilities.swift"
      - "ios/QuakeSignal/Features/Onboarding/OnboardingView.swift"
      - "ios/QuakeSignal/Features/Root/RootView.swift"
      - "ios/QuakeSignal/Features/Settings/SettingsView.swift"
      - "ios/QuakeSignal/Resources/PrivacyInfo.xcprivacy"
      - "ios/QuakeSignal/Resources/**/Localizable.strings"
      - "ios/QuakeSignalShared/ScreenshotAutomation.swift"
      - "ios/QuakeSignalTV/TVDashboardView.swift"
      - "ios/QuakeSignalVision/Resources/PrivacyInfo.xcprivacy"
      - "ios/QuakeSignalWatch/WatchDashboardView.swift"
      - "ios/AppStore/platforms/**/screenshot-manifest-*.json"
      - "ios/AppStore/ExportOptions.plist"
      - "ios/ci_scripts/**"
      - "ios/ScreenshotAutomation/**"
      - "backend/cloudflare/wrangler.jsonc"
      - "backend/cloudflare/package.json"
      - "backend/cloudflare/package-lock.json"
      - "backend/cloudflare/staging/wrangler.staging.template.json"
      - "backend/cloudflare/scripts/legal-page-contract.mjs"
      - "backend/cloudflare/scripts/render-staging-config.mjs"
      - "backend/cloudflare/scripts/smoke-test.mjs"
      - "backend/cloudflare/scripts/smoke-test-policy.mjs"
      - "backend/cloudflare/scripts/smoke-test.test.mjs"
      - "backend/cloudflare/scripts/verify-apns-worker-secrets.mjs"
      - "backend/cloudflare/scripts/verify-production-gates.mjs"
      - "backend/cloudflare/scripts/wait-for-worker-readiness.mjs"
      - "backend/cloudflare/scripts/wait-for-worker-readiness.test.mjs"
      - "backend/cloudflare/scripts/dispose-historical-apns-environment-incidents.mjs"
      - "backend/cloudflare/scripts/dispose-historical-apns-environment-incidents.test.mjs"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
      - "packaging/homebrew-tap/**"
      - "desktop/src-tauri/src/lib.rs"
      - "ios/project.yml"
      - "ios/QuakeSignal.xcodeproj/project.pbxproj"
      - "ios/QuakeSignal.xcodeproj/xcshareddata/xcschemes/**"
      - "ios/QuakeSignal/Supporting/Info.plist"
      - "ios/QuakeSignalTV/Supporting/Info.plist"
      - "ios/QuakeSignalVision/Supporting/Info.plist"
      - "ios/QuakeSignalWatch/Supporting/Info.plist"
      - "ios/QuakeSignal/Supporting/QuakeSignal-Release.entitlements"
      - "ios/QuakeSignalVision/Supporting/QuakeSignalVision-Release.entitlements"
      - "ios/QuakeSignal/App/PlatformCapabilities.swift"
      - "ios/QuakeSignal/Features/Onboarding/OnboardingView.swift"
      - "ios/QuakeSignal/Features/Root/RootView.swift"
      - "ios/QuakeSignal/Features/Settings/SettingsView.swift"
      - "ios/QuakeSignal/Resources/PrivacyInfo.xcprivacy"
      - "ios/QuakeSignal/Resources/**/Localizable.strings"
      - "ios/QuakeSignalShared/ScreenshotAutomation.swift"
      - "ios/QuakeSignalTV/TVDashboardView.swift"
      - "ios/QuakeSignalVision/Resources/PrivacyInfo.xcprivacy"
      - "ios/QuakeSignalWatch/WatchDashboardView.swift"
      - "ios/AppStore/platforms/**/screenshot-manifest-*.json"
      - "ios/AppStore/ExportOptions.plist"
      - "ios/ci_scripts/**"
      - "ios/ScreenshotAutomation/**"
      - "backend/cloudflare/wrangler.jsonc"
      - "backend/cloudflare/package.json"
      - "backend/cloudflare/package-lock.json"
      - "backend/cloudflare/staging/wrangler.staging.template.json"
      - "backend/cloudflare/scripts/legal-page-contract.mjs"
      - "backend/cloudflare/scripts/render-staging-config.mjs"
      - "backend/cloudflare/scripts/smoke-test.mjs"
      - "backend/cloudflare/scripts/smoke-test-policy.mjs"
      - "backend/cloudflare/scripts/smoke-test.test.mjs"
      - "backend/cloudflare/scripts/verify-apns-worker-secrets.mjs"
      - "backend/cloudflare/scripts/verify-production-gates.mjs"
      - "backend/cloudflare/scripts/wait-for-worker-readiness.mjs"
      - "backend/cloudflare/scripts/wait-for-worker-readiness.test.mjs"
      - "backend/cloudflare/scripts/dispose-historical-apns-environment-incidents.mjs"
      - "backend/cloudflare/scripts/dispose-historical-apns-environment-incidents.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      # Ubuntu hosted runners include Go. Pin the actionlint module version so
      # workflow syntax and expression validation is reproducible and does not
      # depend on a floating GitHub Action implementation.
      - name: Run actionlint
        run: |
          set -euo pipefail
          go version
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11 .github/workflows/*.yml

      - name: Reject forbidden monitor GitHub secret names
        run: |
          set -euo pipefail
          if rg -n '\$\{\{\s*secrets\.GITHUB_' .github/workflows/terminal-dlq-monitor.yml; then
            echo "::error::GitHub does not permit custom secret names beginning with GITHUB_"
            exit 1
          fi

      - name: Test terminal DLQ fallback monitor
        run: |
          set -euo pipefail
          bash -n .github/scripts/check-terminal-dlq-fallback.sh
          bash -n .github/scripts/open-or-update-terminal-dlq-recovery-issue.sh
          bash -n .github/scripts/test-check-terminal-dlq-fallback.sh
          bash -n .github/scripts/test-open-or-update-terminal-dlq-recovery-issue.sh
          bash .github/scripts/test-check-terminal-dlq-fallback.sh
          bash .github/scripts/test-open-or-update-terminal-dlq-recovery-issue.sh

      - name: Test Homebrew cask renderer
        run: |
          set -euo pipefail
          ruby .github/scripts/test-render-homebrew-cask.rb

      - name: Test App Store asset release gates
        run: |
          set -euo pipefail
          ruby .github/scripts/verify-store-assets.test.rb

      - name: Test credential-free Apple screenshot harness
        run: |
          set -euo pipefail
          bash -n ios/ScreenshotAutomation/capture-platform-screenshot.sh
          bash -n ios/ScreenshotAutomation/capture-platform-screenshot-set.sh
          bash -n ios/ScreenshotAutomation/capture-platform-screenshot-interface.test.sh
          bash -n ios/ScreenshotAutomation/watch-capture-guard.sh
          bash -n ios/ScreenshotAutomation/watch-capture-guard.test.sh
          /usr/bin/ruby -c ios/ScreenshotAutomation/platform-screenshot-plan.rb
          /usr/bin/ruby -c ios/ScreenshotAutomation/platform-screenshot-plan.test.rb
          /usr/bin/ruby -c ios/ScreenshotAutomation/assemble-platform-screenshot-provenance.rb
          /usr/bin/ruby -c ios/ScreenshotAutomation/assemble-platform-screenshot-provenance.test.rb
          /usr/bin/ruby -c ios/ScreenshotAutomation/validate-watch-foreground-badge.rb
          /usr/bin/ruby -c ios/ScreenshotAutomation/validate-watch-foreground-badge.test.rb
          /usr/bin/ruby -c .github/scripts/verify-native-apple-screenshot-candidates.rb
          /usr/bin/ruby -c .github/scripts/verify-native-apple-screenshot-candidates.test.rb
          /usr/bin/ruby ios/ScreenshotAutomation/platform-screenshot-plan.test.rb
          /usr/bin/ruby ios/ScreenshotAutomation/assemble-platform-screenshot-provenance.test.rb
          bash ios/ScreenshotAutomation/capture-platform-screenshot-interface.test.sh
          bash ios/ScreenshotAutomation/watch-capture-guard.test.sh
          /usr/bin/ruby ios/ScreenshotAutomation/validate-watch-foreground-badge.test.rb

      - name: Test iOS release contract
        run: |
          set -euo pipefail
          bash -n ios/ci_scripts/ci_post_clone.sh \
            ios/ci_scripts/ci_pre_xcodebuild.sh \
            ios/ci_scripts/ci_post_xcodebuild.sh \
            ios/ci_scripts/verify-signed-apple-artifacts.sh \
            .github/scripts/verify-signed-apple-artifacts.test.sh
          node --test .github/scripts/verify-ios-release-contract.test.mjs
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_xcode_cloud_release_guard.py
          node .github/scripts/verify-ios-release-contract.mjs
          .github/scripts/verify-signed-apple-artifacts.test.sh
          node --test backend/cloudflare/scripts/smoke-test.test.mjs \
            backend/cloudflare/scripts/wait-for-worker-readiness.test.mjs
          node --test backend/cloudflare/scripts/dispose-historical-apns-environment-incidents.test.mjs

      - name: Test desktop and Homebrew release contract
        run: |
          set -euo pipefail
          node --test .github/scripts/verify-desktop-release-contract.test.mjs
          node .github/scripts/verify-desktop-release-contract.mjs
