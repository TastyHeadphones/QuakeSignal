name: Cloudflare Staging Worker

on:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "backend/cloudflare/**"
      - ".github/workflows/cloudflare-staging.yml"
      - ".github/workflows/cloudflare.yml"
      - ".github/workflows/ios.yml"
      - ".github/scripts/verify-ios-release-contract.mjs"
      - ".github/scripts/verify-ios-release-contract.test.mjs"
      - ".github/scripts/test_xcode_cloud_release_guard.py"
      - "ios/ci_scripts/**"
      - "ios/project.yml"
      - "ios/QuakeSignal.xcodeproj/project.pbxproj"
      - "ios/QuakeSignal.xcodeproj/xcshareddata/xcschemes/**"
      - "ios/QuakeSignal/Supporting/Info.plist"
      - "ios/QuakeSignalTV/Supporting/Info.plist"
      - "ios/QuakeSignalVision/Supporting/Info.plist"
      - "ios/QuakeSignalWatch/Supporting/Info.plist"
      - "ios/QuakeSignal/Supporting/QuakeSignal-Release.entitlements"
      - "ios/QuakeSignalVision/Supporting/QuakeSignalVision-Release.entitlements"
      - "ios/AppStore/ExportOptions.plist"
  pull_request:
    paths:
      - "backend/cloudflare/**"
      - ".github/workflows/cloudflare-staging.yml"
      - ".github/workflows/cloudflare.yml"
      - ".github/workflows/ios.yml"
      - ".github/scripts/verify-ios-release-contract.mjs"
      - ".github/scripts/verify-ios-release-contract.test.mjs"
      - ".github/scripts/test_xcode_cloud_release_guard.py"
      - "ios/ci_scripts/**"
      - "ios/project.yml"
      - "ios/QuakeSignal.xcodeproj/project.pbxproj"
      - "ios/QuakeSignal.xcodeproj/xcshareddata/xcschemes/**"
      - "ios/QuakeSignal/Supporting/Info.plist"
      - "ios/QuakeSignalTV/Supporting/Info.plist"
      - "ios/QuakeSignalVision/Supporting/Info.plist"
      - "ios/QuakeSignalWatch/Supporting/Info.plist"
      - "ios/QuakeSignal/Supporting/QuakeSignal-Release.entitlements"
      - "ios/QuakeSignalVision/Supporting/QuakeSignalVision-Release.entitlements"
      - "ios/AppStore/ExportOptions.plist"
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: Apply isolated staging D1 migrations and deploy the Debug-only Worker
        required: false
        default: false
        type: boolean
      verify_staging_apns:
        description: Require staging APNs secrets and run the remote readiness smoke after deployment
        required: false
        default: false
        type: boolean

concurrency:
  group: cloudflare-staging-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate isolated staging configuration
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/cloudflare/package-lock.json

      - name: Verify iOS and Worker release contract
        run: node .github/scripts/verify-ios-release-contract.mjs

      - name: Install Worker dependencies
        working-directory: backend/cloudflare
        run: npm ci

      - name: Type-check Worker and staging config renderer
        working-directory: backend/cloudflare
        run: |
          set -euo pipefail
          npm run check
          npm run test:alert-delivery-reliability
          npm run test:app-attest-registration-recovery
          npm run test:production-training-test-push-limit
          npm run test:delayed-training-test-push
          npm run test:production-gates
          npm run test:render-staging-config
          npm run test:verify-apns-secret-config
          npm run test:worker-readiness
          npm run test:smoke-test
          npm audit --audit-level=high

  deploy-staging:
    name: Deploy isolated Debug staging Worker
    needs: validate
    # Staging can contact APNs and persist device subscriptions. It is still a
    # manual protected-main operation and must never be a PR preview.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_staging &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-staging

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/cloudflare/package-lock.json

      # Install only the raw, reviewed dependency graph. No package lifecycle
      # hook may run before the protected Cloudflare credentials are exposed.
      - name: Install Worker dependencies
        working-directory: backend/cloudflare
        run: npm ci --ignore-scripts

      - name: Reverify immutable release source after dependency install
        run: |
          set -euo pipefail
          node .github/scripts/verify-ios-release-contract.mjs
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Render isolated staging Worker configuration
        working-directory: backend/cloudflare
        env:
          CLOUDFLARE_STAGING_WORKER_NAME: ${{ vars.CLOUDFLARE_STAGING_WORKER_NAME }}
          CLOUDFLARE_STAGING_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_STAGING_D1_DATABASE_NAME }}
          CLOUDFLARE_STAGING_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_STAGING_D1_DATABASE_ID }}
          CLOUDFLARE_STAGING_DEVICE_API_RATE_LIMIT_NAMESPACE_ID: ${{ vars.CLOUDFLARE_STAGING_DEVICE_API_RATE_LIMIT_NAMESPACE_ID }}
          CLOUDFLARE_STAGING_DEVICE_MUTATION_RATE_LIMIT_NAMESPACE_ID: ${{ vars.CLOUDFLARE_STAGING_DEVICE_MUTATION_RATE_LIMIT_NAMESPACE_ID }}
          CLOUDFLARE_STAGING_APP_ATTEST_CHALLENGE_RATE_LIMIT_NAMESPACE_ID: ${{ vars.CLOUDFLARE_STAGING_APP_ATTEST_CHALLENGE_RATE_LIMIT_NAMESPACE_ID }}
          CLOUDFLARE_STAGING_ALLOWED_BUNDLE_VERSIONS: ${{ vars.CLOUDFLARE_STAGING_ALLOWED_BUNDLE_VERSIONS }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/quakesignal-staging-wrangler.json"
          node scripts/render-staging-config.mjs --output "$config"
          chmod 600 "$config"
          echo "STAGING_WRANGLER_CONFIG=$config" >> "$GITHUB_ENV"

      - name: Validate rendered staging Worker bundle
        working-directory: backend/cloudflare
        run: |
          set -euo pipefail
          ./node_modules/.bin/wrangler deploy --dry-run --config "$STAGING_WRANGLER_CONFIG"

      - name: Apply generated staging migrations locally first
        working-directory: backend/cloudflare
        env:
          CLOUDFLARE_STAGING_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_STAGING_D1_DATABASE_NAME }}
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/quakesignal-staging-d1-state"
          ./node_modules/.bin/wrangler d1 migrations apply "$CLOUDFLARE_STAGING_D1_DATABASE_NAME" --local --persist-to "$state_dir" --config "$STAGING_WRANGLER_CONFIG"

      - name: Apply isolated staging D1 migrations
        working-directory: backend/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_STAGING_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_STAGING_D1_DATABASE_NAME }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          ./node_modules/.bin/wrangler d1 migrations apply "$CLOUDFLARE_STAGING_D1_DATABASE_NAME" --remote --config "$STAGING_WRANGLER_CONFIG"

      - name: Deploy isolated staging Worker
        working-directory: backend/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          ./node_modules/.bin/wrangler deploy --config "$STAGING_WRANGLER_CONFIG" | tee "$RUNNER_TEMP/quakesignal-staging-deploy.log"

      - name: Record the discovered staging endpoint
        shell: bash
        run: |
          set -euo pipefail
          deploy_log="$RUNNER_TEMP/quakesignal-staging-deploy.log"
          urls="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$deploy_log" | sort -u || true)"
          {
            echo "### Isolated Debug staging Worker"
            if [ -n "$urls" ]; then
              echo
              echo "Wrangler reported this public staging endpoint:"
              echo
              while IFS= read -r url; do echo "- $url"; done <<< "$urls"
              echo
              echo "Before running with \`verify_staging_apns=true\`, copy the intended bare URL into the protected \`CLOUDFLARE_STAGING_WORKER_URL\` environment variable."
            else
              echo
              echo "Wrangler did not print a workers.dev endpoint. Inspect the completed deploy output, then set the intended bare workers.dev URL in \`CLOUDFLARE_STAGING_WORKER_URL\` before enabling readiness verification."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify staging APNs readiness and legal URLs
        if: inputs.verify_staging_apns
        working-directory: backend/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_WORKER_NAME: ${{ vars.CLOUDFLARE_STAGING_WORKER_NAME }}
          STAGING_WORKER_URL: ${{ vars.CLOUDFLARE_STAGING_WORKER_URL }}
        run: |
          set -euo pipefail
          test -n "$STAGING_WORKER_URL"
          node --input-type=module <<'NODE'
          const value = process.env.STAGING_WORKER_URL;
          const workerName = process.env.STAGING_WORKER_NAME;
          const url = new URL(value);
          const labels = url.hostname.split(".");
          if (
            url.protocol !== "https:" ||
            !workerName ||
            !url.hostname.endsWith(".workers.dev") ||
            labels.length < 4 ||
            labels[0] !== workerName ||
            url.pathname !== "/" ||
            url.search ||
            url.hash ||
            url.username ||
            url.password ||
            url.port
          ) {
            throw new Error("CLOUDFLARE_STAGING_WORKER_URL must be the bare https://<CLOUDFLARE_STAGING_WORKER_NAME>.<account-subdomain>.workers.dev URL.");
          }
          NODE
          node scripts/verify-apns-worker-secrets.mjs --config "$STAGING_WRANGLER_CONFIG"
          # Wolfx may reject Worker-origin WebSocket Upgrades. Allow the
          # reviewed 90-second bounded HTTP alternate transport to warm, but
          # require full APNs/upstream readiness before remote smoke tests.
          node scripts/wait-for-worker-readiness.mjs "$STAGING_WORKER_URL"
          node scripts/smoke-test.mjs "$STAGING_WORKER_URL"
