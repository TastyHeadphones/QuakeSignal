name: Desktop builds

# Continuous-integration build only. This workflow never publishes a release
# and never signs anything: releasing is owned exclusively by
# .github/workflows/desktop-release.yml, which is triggered by v* tags.

on:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-build.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: --target universal-apple-darwin
            signing_identity: "-"
          - name: Windows x64
            platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            tauri_args: --target x86_64-pc-windows-msvc
            signing_identity: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-05
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Test frontend safety policy
        working-directory: desktop
        run: npm test

      - name: Build frontend
        working-directory: desktop
        run: npm run build

      - name: Test Rust core
        working-directory: desktop/src-tauri
        run: cargo test --locked

      - name: Test Mac App Store feature
        if: matrix.name == 'macOS universal'
        working-directory: desktop/src-tauri
        run: cargo test --locked --features macos-app-store

      - name: Build Mac App Store configuration without signing
        if: matrix.name == 'macOS universal'
        working-directory: desktop
        env:
          VITE_MAC_APP_STORE: "true"
        run: >-
          npm run tauri -- build --no-bundle --features macos-app-store
          --config src-tauri/tauri.macos-app-store.conf.json

      - name: Build native installer
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.signing_identity }}
        with:
          projectPath: desktop
          args: ${{ matrix.tauri_args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: quakesignal-[platform]-[arch]-[bundle]
