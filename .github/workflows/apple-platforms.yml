name: Native Apple platform release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native Apple platform to archive in this protected run
        required: true
        default: tvos
        type: choice
        options:
          - tvos
          - visionos
          - maccatalyst
      archive_only:
        description: Archive, verify, and hash a signed IPA or PKG without retaining or uploading it
        required: false
        default: false
        type: boolean
      upload_to_testflight:
        description: Archive, sign, and upload the selected native platform build to TestFlight
        required: false
        default: false
        type: boolean
      build_number:
        description: Exact coordinated CFBundleVersion from ios/project.yml
        required: false
        default: "19"
        type: string
      source_commit:
        description: Exact 40-character lowercase protected-main commit to sign
        required: true
        type: string

concurrency:
  group: apple-platforms-${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  XCODE_PROJECT: ios/QuakeSignal.xcodeproj
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  release:
    name: Archive ${{ matrix.name }} and optionally upload to App Store Connect
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.archive_only || inputs.upload_to_testflight) &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected
    runs-on: macos-latest
    environment:
      name: ios-app-store-release
    concurrency:
      group: quakesignal-production-app-attest-policy
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: ${{ inputs.platform }}
            name: ${{ inputs.platform == 'tvos' && 'tvOS' || inputs.platform == 'visionos' && 'visionOS' || 'Mac Catalyst' }}
            scheme: ${{ inputs.platform == 'tvos' && 'QuakeSignalTV' || inputs.platform == 'visionos' && 'QuakeSignalVision' || 'QuakeSignal' }}
            destination: ${{ inputs.platform == 'tvos' && 'generic/platform=tvOS' || inputs.platform == 'visionos' && 'generic/platform=visionOS' || 'generic/platform=macOS,variant=Mac Catalyst' }}
            bundle_identifier: com.quakesignal.app
            profile_secret: ${{ inputs.platform == 'tvos' && 'TVOS_APP_STORE_PROVISIONING_PROFILE' || inputs.platform == 'visionos' && 'VISIONOS_APP_STORE_PROVISIONING_PROFILE' || 'MACCATALYST_APP_STORE_PROVISIONING_PROFILE' }}
            profile_variable: ${{ inputs.platform == 'tvos' && 'TVOS_APP_STORE_PROFILE_NAME' || inputs.platform == 'visionos' && 'VISIONOS_APP_STORE_PROFILE_NAME' || 'MACCATALYST_APP_STORE_PROFILE_NAME' }}
            profile_platform: ${{ inputs.platform == 'tvos' && 'tvOS' || inputs.platform == 'visionos' && 'visionOS' || 'OSX' }}
            profile_extension: ${{ inputs.platform == 'maccatalyst' && 'provisionprofile' || 'mobileprovision' }}
            altool_platform: ${{ inputs.platform == 'tvos' && 'appletvos' || inputs.platform == 'visionos' && 'visionos' || 'macos' }}
            requires_alert_entitlements: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable signed source
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = TastyHeadphones/QuakeSignal
          test "$GITHUB_REF" = refs/heads/main
          test "$REF_PROTECTED" = true
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_COMMIT" = "$GITHUB_SHA"
          test "$(git rev-parse --verify HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      # Keep the frozen source/project/artifact contract ahead of every step
      # that receives signing or upload credentials. tvOS and visionOS are
      # foreground-only; Catalyst shares the production iOS Worker contract.
      - name: Verify frozen Apple platform release contract
        id: release-contract
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: node .github/scripts/verify-ios-release-contract.mjs --build-number "$BUILD_NUMBER"

      - name: Install checksum-pinned XcodeGen
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen.zip"
          install_root="$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $archive" | shasum -a 256 -c -
          mkdir -p "$install_root"
          ditto -x -k "$archive" "$install_root"
          echo "$install_root/xcodegen/bin" >> "$GITHUB_PATH"
          "$install_root/xcodegen/bin/xcodegen" --version

      - name: Regenerate Xcode project and verify it is committed
        working-directory: ios
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          git diff --exit-code -- QuakeSignal.xcodeproj/project.pbxproj QuakeSignal.xcodeproj/xcshareddata/xcschemes
          test -z "$(git status --porcelain --untracked-files=all -- QuakeSignal.xcodeproj)"

      - name: Validate selected protected signing configuration
        env:
          PLATFORM_KEY: ${{ matrix.key }}
          PLATFORM_SCHEME: ${{ matrix.scheme }}
          PLATFORM_DESTINATION: ${{ matrix.destination }}
          PLATFORM_BUNDLE_IDENTIFIER: ${{ matrix.bundle_identifier }}
          PLATFORM_PROFILE_PLATFORM: ${{ matrix.profile_platform }}
          PLATFORM_PROFILE_EXTENSION: ${{ matrix.profile_extension }}
          PLATFORM_ALTOOL_PLATFORM: ${{ matrix.altool_platform }}
          PLATFORM_REQUIRES_ALERT_ENTITLEMENTS: ${{ matrix.requires_alert_entitlements }}
          PLATFORM_PROFILE: ${{ secrets[matrix.profile_secret] }}
          PLATFORM_PROFILE_NAME: ${{ vars[matrix.profile_variable] }}
          PLATFORM_INSTALLER_IDENTITY: ${{ inputs.platform == 'maccatalyst' && vars.MACCATALYST_APP_STORE_INSTALLER_IDENTITY || '' }}
          PLATFORM_INSTALLER_CERTIFICATE: ${{ inputs.platform == 'maccatalyst' && secrets.MACCATALYST_APP_STORE_INSTALLER_CERTIFICATE || '' }}
          PLATFORM_INSTALLER_CERTIFICATE_PASSWORD: ${{ inputs.platform == 'maccatalyst' && secrets.MACCATALYST_APP_STORE_INSTALLER_CERTIFICATE_PASSWORD || '' }}
          IOS_CERTIFICATE: ${{ secrets.IOS_APP_STORE_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_APP_STORE_CERTIFICATE_PASSWORD }}
          ARCHIVE_ONLY: ${{ inputs.archive_only }}
          UPLOAD_TO_TESTFLIGHT: ${{ inputs.upload_to_testflight }}
        run: |
          set -euo pipefail
          if [ "$ARCHIVE_ONLY" = "true" ] && [ "$UPLOAD_TO_TESTFLIGHT" = "true" ]; then
            echo "::error::Choose either archive_only or upload_to_testflight, not both"
            exit 1
          fi
          if [ "$ARCHIVE_ONLY" != "true" ] && [ "$UPLOAD_TO_TESTFLIGHT" != "true" ]; then
            echo "::error::Choose archive_only or upload_to_testflight"
            exit 1
          fi
          required=(
            PLATFORM_KEY
            PLATFORM_SCHEME
            PLATFORM_DESTINATION
            PLATFORM_BUNDLE_IDENTIFIER
            PLATFORM_PROFILE_PLATFORM
            PLATFORM_PROFILE_EXTENSION
            PLATFORM_ALTOOL_PLATFORM
            PLATFORM_REQUIRES_ALERT_ENTITLEMENTS
            PLATFORM_PROFILE
            PLATFORM_PROFILE_NAME
            IOS_CERTIFICATE
            IOS_CERTIFICATE_PASSWORD
          )
          if [ "$PLATFORM_KEY" = maccatalyst ]; then
            required+=(
              PLATFORM_INSTALLER_IDENTITY
              PLATFORM_INSTALLER_CERTIFICATE
              PLATFORM_INSTALLER_CERTIFICATE_PASSWORD
            )
          fi
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::ios-app-store-release is missing selected $PLATFORM_KEY configuration: $(IFS=,; echo "${missing[*]}")"
            exit 1
          fi
          case "$PLATFORM_KEY" in
            tvos)
              test "$PLATFORM_SCHEME" = QuakeSignalTV
              test "$PLATFORM_DESTINATION" = generic/platform=tvOS
              test "$PLATFORM_PROFILE_PLATFORM" = tvOS
              test "$PLATFORM_PROFILE_EXTENSION" = mobileprovision
              test "$PLATFORM_ALTOOL_PLATFORM" = appletvos
              test "$PLATFORM_REQUIRES_ALERT_ENTITLEMENTS" = false
              ;;
            visionos)
              test "$PLATFORM_SCHEME" = QuakeSignalVision
              test "$PLATFORM_DESTINATION" = generic/platform=visionOS
              test "$PLATFORM_PROFILE_PLATFORM" = visionOS
              test "$PLATFORM_PROFILE_EXTENSION" = mobileprovision
              test "$PLATFORM_ALTOOL_PLATFORM" = visionos
              test "$PLATFORM_REQUIRES_ALERT_ENTITLEMENTS" = false
              ;;
            maccatalyst)
              test "$PLATFORM_SCHEME" = QuakeSignal
              test "$PLATFORM_DESTINATION" = 'generic/platform=macOS,variant=Mac Catalyst'
              test "$PLATFORM_PROFILE_PLATFORM" = OSX
              test "$PLATFORM_PROFILE_EXTENSION" = provisionprofile
              test "$PLATFORM_ALTOOL_PLATFORM" = macos
              test "$PLATFORM_REQUIRES_ALERT_ENTITLEMENTS" = false
              case "$PLATFORM_INSTALLER_IDENTITY" in
                'Mac Installer Distribution: '*' (5TT564H883)'|'3rd Party Mac Developer Installer: '*' (5TT564H883)') ;;
                *) echo "::error::Mac Catalyst requires an exact Mac Installer Distribution identity"; exit 1 ;;
              esac
              ;;
            *)
              echo "::error::Unsupported native platform $PLATFORM_KEY"
              exit 1
              ;;
          esac
          test "$PLATFORM_BUNDLE_IDENTIFIER" = com.quakesignal.app

      - name: Validate App Store Connect upload configuration
        if: ${{ inputs.upload_to_testflight && !inputs.archive_only }}
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER: ${{ vars.APP_STORE_CONNECT_API_ISSUER }}
        run: |
          set -euo pipefail
          required=(APP_STORE_CONNECT_KEY APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER)
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::ios-app-store-release is missing upload configuration: $(IFS=,; echo "${missing[*]}")"
            exit 1
          fi

      - name: Import Apple Distribution certificate and selected App Store profile
        env:
          PLATFORM_KEY: ${{ matrix.key }}
          PLATFORM_PROFILE_EXTENSION: ${{ matrix.profile_extension }}
          PLATFORM_PROFILE: ${{ secrets[matrix.profile_secret] }}
          PLATFORM_INSTALLER_IDENTITY: ${{ inputs.platform == 'maccatalyst' && vars.MACCATALYST_APP_STORE_INSTALLER_IDENTITY || '' }}
          PLATFORM_INSTALLER_CERTIFICATE: ${{ inputs.platform == 'maccatalyst' && secrets.MACCATALYST_APP_STORE_INSTALLER_CERTIFICATE || '' }}
          PLATFORM_INSTALLER_CERTIFICATE_PASSWORD: ${{ inputs.platform == 'maccatalyst' && secrets.MACCATALYST_APP_STORE_INSTALLER_CERTIFICATE_PASSWORD || '' }}
          IOS_CERTIFICATE: ${{ secrets.IOS_APP_STORE_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_APP_STORE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/quakesignal-$PLATFORM_KEY.keychain-db"
          certificate="$RUNNER_TEMP/quakesignal-$PLATFORM_KEY-distribution.p12"
          installer_certificate="$RUNNER_TEMP/quakesignal-$PLATFORM_KEY-installer.p12"
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          profile="$profile_dir/quakesignal-$PLATFORM_KEY.$PLATFORM_PROFILE_EXTENSION"
          keychain_password="$(uuidgen)"

          printf '%s' "$IOS_CERTIFICATE" | base64 -D > "$certificate"
          mkdir -p "$profile_dir"
          printf '%s' "$PLATFORM_PROFILE" | base64 -D > "$profile"
          chmod 600 "$certificate" "$profile"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security import "$certificate" -k "$keychain" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          if [ "$PLATFORM_KEY" = maccatalyst ]; then
            printf '%s' "$PLATFORM_INSTALLER_CERTIFICATE" | base64 -D > "$installer_certificate"
            chmod 600 "$installer_certificate"
            security import "$installer_certificate" -k "$keychain" -P "$PLATFORM_INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productbuild
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security find-identity -v -p codesigning "$keychain"
          if [ "$PLATFORM_KEY" = maccatalyst ]; then
            security find-identity -v -p basic "$keychain" | grep -F -- "$PLATFORM_INSTALLER_IDENTITY"
          fi

      - name: Archive selected signed App Store build
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          PLATFORM_KEY: ${{ matrix.key }}
          PLATFORM_SCHEME: ${{ matrix.scheme }}
          PLATFORM_DESTINATION: ${{ matrix.destination }}
          PLATFORM_PROFILE_NAME: ${{ vars[matrix.profile_variable] }}
        run: |
          set -euo pipefail
          code_sign_style=Manual
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$PLATFORM_SCHEME" \
            -configuration Release \
            -destination "$PLATFORM_DESTINATION" \
            -archivePath "$RUNNER_TEMP/QuakeSignal-$PLATFORM_KEY.xcarchive" \
            DEVELOPMENT_TEAM=5TT564H883 \
            CODE_SIGN_STYLE="$code_sign_style" \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            QUAKESIGNAL_TV_PROFILE_NAME="$PLATFORM_PROFILE_NAME" \
            QUAKESIGNAL_VISION_PROFILE_NAME="$PLATFORM_PROFILE_NAME" \
            QUAKESIGNAL_CATALYST_PROFILE_NAME="$PLATFORM_PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export selected App Store Connect artifact
        env:
          PLATFORM_KEY: ${{ matrix.key }}
          PLATFORM_BUNDLE_IDENTIFIER: ${{ matrix.bundle_identifier }}
          PLATFORM_PROFILE_NAME: ${{ vars[matrix.profile_variable] }}
          PLATFORM_INSTALLER_IDENTITY: ${{ inputs.platform == 'maccatalyst' && vars.MACCATALYST_APP_STORE_INSTALLER_IDENTITY || '' }}
        run: |
          set -euo pipefail
          export_options="$RUNNER_TEMP/QuakeSignal-$PLATFORM_KEY-ExportOptions.plist"
          export_path="$RUNNER_TEMP/QuakeSignal-$PLATFORM_KEY-export"
          cp ios/AppStore/ExportOptions.plist "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :manageAppVersionAndBuildNumber bool false' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$PLATFORM_BUNDLE_IDENTIFIER string $PLATFORM_PROFILE_NAME" "$export_options"
          if [ "$PLATFORM_KEY" = maccatalyst ]; then
            /usr/libexec/PlistBuddy -c "Add :installerSigningCertificate string $PLATFORM_INSTALLER_IDENTITY" "$export_options"
          fi
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/QuakeSignal-$PLATFORM_KEY.xcarchive" \
            -exportOptionsPlist "$export_options" \
            -exportPath "$export_path"
          shopt -s nullglob
          if [ "$PLATFORM_KEY" = maccatalyst ]; then
            artifacts=("$export_path"/*.pkg)
            unexpected=("$export_path"/*.ipa)
            artifact_kind=pkg
          else
            artifacts=("$export_path"/*.ipa)
            unexpected=("$export_path"/*.pkg)
            artifact_kind=ipa
          fi
          if [ "${#artifacts[@]}" -ne 1 ] || [ "${#unexpected[@]}" -ne 0 ] || [ ! -f "${artifacts[0]:-}" ] || [ -L "${artifacts[0]:-}" ]; then
            echo "::error::Expected exactly one regular non-symlink exported $PLATFORM_KEY $artifact_kind"
            exit 1
          fi
          echo "APPLE_ARTIFACT_PATH=${artifacts[0]}" >> "$GITHUB_ENV"
          echo 'APPLE_ARTIFACT_VERIFIED=false' >> "$GITHUB_ENV"

      - name: Verify selected signed archive and exported artifact
        shell: bash
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          PLATFORM_KEY: ${{ matrix.key }}
          PLATFORM_PROFILE_NAME: ${{ vars[matrix.profile_variable] }}
          PLATFORM_INSTALLER_IDENTITY: ${{ inputs.platform == 'maccatalyst' && vars.MACCATALYST_APP_STORE_INSTALLER_IDENTITY || '' }}
        run: |
          set -euo pipefail
          verifier_arguments=(
            --platform "$PLATFORM_KEY"
            --archive "$RUNNER_TEMP/QuakeSignal-$PLATFORM_KEY.xcarchive"
            --exported "${APPLE_ARTIFACT_PATH:?APPLE_ARTIFACT_PATH is not set after export}"
            --build-number "$BUILD_NUMBER"
            --marketing-version 1.2
            --team-id 5TT564H883
            --archive-signing strict-distribution
            --host-profile-name "$PLATFORM_PROFILE_NAME"
          )
          if [ "$PLATFORM_KEY" = maccatalyst ]; then
            verifier_arguments+=(--installer-identity "${PLATFORM_INSTALLER_IDENTITY:?Mac Catalyst installer identity is missing}")
          fi
          ios/ci_scripts/verify-signed-apple-artifacts.sh "${verifier_arguments[@]}"
          artifact_sha256="$(/usr/bin/shasum -a 256 "$APPLE_ARTIFACT_PATH")"
          artifact_sha256="${artifact_sha256%% *}"
          if [[ ! "$artifact_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Verified Apple artifact did not produce a valid SHA-256 digest"
            exit 1
          fi
          echo "APPLE_ARTIFACT_SHA256=$artifact_sha256" >> "$GITHUB_ENV"
          printf 'Verified `%s` SHA-256: `%s`\n' "${APPLE_ARTIFACT_PATH##*/}" "$artifact_sha256" >> "$GITHUB_STEP_SUMMARY"
          echo 'APPLE_ARTIFACT_VERIFIED=true' >> "$GITHUB_ENV"

      - name: Upload selected build to TestFlight
        if: ${{ inputs.upload_to_testflight && !inputs.archive_only }}
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          PLATFORM_KEY: ${{ matrix.key }}
          PLATFORM_ALTOOL_PLATFORM: ${{ matrix.altool_platform }}
          PLATFORM_BUNDLE_IDENTIFIER: ${{ matrix.bundle_identifier }}
          APP_STORE_CONNECT_APPLE_ID: "6800642443"
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER: ${{ vars.APP_STORE_CONNECT_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ "${APPLE_ARTIFACT_VERIFIED:-false}" != true ]; then
            echo "::error::Refusing to upload an Apple artifact that did not pass signed verification"
            exit 1
          fi
          key_dir="$RUNNER_TEMP/appstore-private-keys"
          key_path="$key_dir/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          mkdir -p "$key_dir"
          cleanup() {
            rm -f "$key_path"
            rmdir "$key_dir" 2>/dev/null || true
          }
          trap cleanup EXIT
          printf '%s' "$APP_STORE_CONNECT_KEY" > "$key_path"
          chmod 600 "$key_path"
          export API_PRIVATE_KEYS_DIR="$key_dir"
          upload_sha256="$(/usr/bin/shasum -a 256 "$APPLE_ARTIFACT_PATH")"
          upload_sha256="${upload_sha256%% *}"
          if [ "$upload_sha256" != "${APPLE_ARTIFACT_SHA256:?Verified Apple artifact SHA-256 is missing}" ]; then
            echo "::error::Apple artifact changed after signed verification"
            exit 1
          fi
          upload_arguments=(
            --platform "$PLATFORM_ALTOOL_PLATFORM"
            --apple-id "$APP_STORE_CONNECT_APPLE_ID"
            --bundle-id "$PLATFORM_BUNDLE_IDENTIFIER"
            --bundle-version "$BUILD_NUMBER"
            --bundle-short-version-string 1.2
            --api-key "$APP_STORE_CONNECT_KEY_ID"
            --api-issuer "$APP_STORE_CONNECT_ISSUER"
            --output-format json
          )
          xcrun altool --validate-app "$APPLE_ARTIFACT_PATH" "${upload_arguments[@]}"
          xcrun altool --upload-package "$APPLE_ARTIFACT_PATH" "${upload_arguments[@]}"

      - name: Remove signing material
        if: always()
        env:
          PLATFORM_KEY: ${{ matrix.key }}
          PLATFORM_PROFILE_EXTENSION: ${{ matrix.profile_extension }}
        run: |
          rm -f "$RUNNER_TEMP/quakesignal-$PLATFORM_KEY-distribution.p12"
          rm -f "$RUNNER_TEMP/quakesignal-$PLATFORM_KEY-installer.p12"
          rm -f "$RUNNER_TEMP/QuakeSignal-$PLATFORM_KEY-ExportOptions.plist"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/quakesignal-$PLATFORM_KEY.$PLATFORM_PROFILE_EXTENSION"
          rmdir "$RUNNER_TEMP/appstore-private-keys" 2>/dev/null || true
          security delete-keychain "$RUNNER_TEMP/quakesignal-$PLATFORM_KEY.keychain-db" 2>/dev/null || true

      - name: Write signed release attestation
        env:
          ARCHIVE_ONLY: ${{ inputs.archive_only }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          PLATFORM_KEY: ${{ matrix.key }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          test "${APPLE_ARTIFACT_VERIFIED:-false}" = true
          attestation_root="$RUNNER_TEMP/signed-release-attestation-$PLATFORM_KEY"
          mkdir -m 700 "$attestation_root"
          ATTESTATION_PATH="$attestation_root/signed-release-attestation.json" \
            /usr/bin/ruby -rjson -rtime -e '
              build = Integer(ENV.fetch("BUILD_NUMBER"), 10)
              abort "signed release attestation requires build 19" unless build == 19
              platform = ENV.fetch("PLATFORM_KEY")
              abort "signed release attestation platform is invalid" unless %w[tvos visionos maccatalyst].include?(platform)
              sha256 = ENV.fetch("APPLE_ARTIFACT_SHA256")
              abort "signed release attestation requires a valid artifact SHA-256" unless sha256.match?(/\A[0-9a-f]{64}\z/)
              attestation = {
                "schemaVersion" => 1,
                "repository" => ENV.fetch("GITHUB_REPOSITORY"),
                "workflowFile" => ".github/workflows/apple-platforms.yml",
                "runId" => Integer(ENV.fetch("GITHUB_RUN_ID"), 10),
                "runAttempt" => Integer(ENV.fetch("GITHUB_RUN_ATTEMPT"), 10),
                "event" => ENV.fetch("GITHUB_EVENT_NAME"),
                "headBranch" => ENV.fetch("GITHUB_REF_NAME"),
                "headSha" => ENV.fetch("GITHUB_SHA"),
                "sourceCommit" => ENV.fetch("SOURCE_COMMIT"),
                "marketingVersion" => "1.2",
                "buildNumber" => build,
                "distributionMode" => ENV.fetch("ARCHIVE_ONLY") == "true" ? "archive-only" : "testflight-upload",
                "platforms" => [platform],
                "artifact" => {
                  "kind" => platform == "maccatalyst" ? "pkg" : "ipa",
                  "sha256" => sha256,
                },
                "attestedAtUtc" => Time.now.utc.iso8601,
              }
              abort "attestation source is not the run head" unless
                attestation.fetch("sourceCommit") == attestation.fetch("headSha")
              File.open(ENV.fetch("ATTESTATION_PATH"), File::WRONLY | File::CREAT | File::EXCL, 0o600) do |file|
                file.write(JSON.pretty_generate(attestation) + "\n")
              end
            '

      - name: Upload signed release attestation only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-release-attestation-${{ matrix.key }}-${{ inputs.source_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signed-release-attestation-${{ matrix.key }}/signed-release-attestation.json
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          overwrite: false
          retention-days: 30
