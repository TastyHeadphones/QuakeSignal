name: Native tvOS and visionOS release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native Apple platform to archive in this protected run
        required: true
        default: tvos
        type: choice
        options:
          - tvos
          - visionos
      archive_only:
        description: Archive, export, and validate a signed IPA without uploading it to App Store Connect
        required: false
        default: false
        type: boolean
      upload_to_testflight:
        description: Archive, sign, and upload the selected native platform build to TestFlight
        required: false
        default: false
        type: boolean
      build_number:
        description: Exact coordinated CFBundleVersion from ios/project.yml and the Worker App Attest allow-list
        required: false
        default: "8"
        type: string

concurrency:
  group: apple-platforms-${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  XCODE_PROJECT: ios/QuakeSignal.xcodeproj
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  release:
    name: Archive ${{ matrix.name }} and optionally upload to TestFlight
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.archive_only || inputs.upload_to_testflight) &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected
    runs-on: macos-latest
    environment:
      name: ios-app-store-release
    concurrency:
      group: quakesignal-production-app-attest-policy
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: ${{ inputs.platform }}
            name: ${{ inputs.platform == 'tvos' && 'tvOS' || 'visionOS' }}
            scheme: ${{ inputs.platform == 'tvos' && 'QuakeSignalTV' || 'QuakeSignalVision' }}
            destination: ${{ inputs.platform == 'tvos' && 'generic/platform=tvOS' || 'generic/platform=visionOS' }}
            bundle_identifier: com.quakesignal.app
            profile_secret: ${{ inputs.platform == 'tvos' && 'TVOS_APP_STORE_PROVISIONING_PROFILE' || 'VISIONOS_APP_STORE_PROVISIONING_PROFILE' }}
            profile_variable: ${{ inputs.platform == 'tvos' && 'TVOS_APP_STORE_PROFILE_NAME' || 'VISIONOS_APP_STORE_PROFILE_NAME' }}
            profile_platform: ${{ inputs.platform == 'tvos' && 'tvOS' || 'visionOS' }}
            requires_alert_entitlements: ${{ inputs.platform == 'visionos' && 'true' || 'false' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Keep both checks ahead of any step that receives signing or upload
      # credentials. The shared concurrency lock prevents a Worker policy
      # deployment from racing the proof and subsequent archive/upload.
      - name: Verify Apple platform and Worker release contract
        id: release-contract
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: node .github/scripts/verify-ios-release-contract.mjs --build-number "$BUILD_NUMBER"

      - name: Verify production notification origin readiness and contract
        working-directory: backend/cloudflare
        env:
          IOS_RELEASE_API_BASE_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          APP_ATTEST_POLICY_FINGERPRINT: ${{ steps.release-contract.outputs.app_attest_policy_fingerprint }}
        run: |
          set -euo pipefail
          if [ "$IOS_RELEASE_API_BASE_URL" != "https://quakesignal-api.hopeso.workers.dev" ]; then
            echo "::error::IOS_RELEASE_API_BASE_URL must be https://quakesignal-api.hopeso.workers.dev"
            exit 1
          fi
          node scripts/wait-for-worker-readiness.mjs "$IOS_RELEASE_API_BASE_URL"
          node scripts/smoke-test.mjs "$IOS_RELEASE_API_BASE_URL" \
            --expected-app-attest-policy-fingerprint "$APP_ATTEST_POLICY_FINGERPRINT" \
            --required-app-attest-bundle-version "$BUILD_NUMBER"

      - name: Install checksum-pinned XcodeGen
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen.zip"
          install_root="$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $archive" | shasum -a 256 -c -
          mkdir -p "$install_root"
          ditto -x -k "$archive" "$install_root"
          echo "$install_root/xcodegen/bin" >> "$GITHUB_PATH"
          "$install_root/xcodegen/bin/xcodegen" --version

      - name: Regenerate Xcode project and verify it is committed
        working-directory: ios
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          git diff --exit-code -- QuakeSignal.xcodeproj/project.pbxproj QuakeSignal.xcodeproj/xcshareddata/xcschemes
          test -z "$(git status --porcelain --untracked-files=all -- QuakeSignal.xcodeproj)"

      - name: Install selected Apple platform component
        env:
          DOWNLOAD_PLATFORM: ${{ matrix.profile_platform }}
        run: xcodebuild -downloadPlatform "$DOWNLOAD_PLATFORM" -architectureVariant arm64

      - name: Validate selected protected signing configuration
        env:
          PLATFORM_KEY: ${{ matrix.key }}
          PLATFORM_SCHEME: ${{ matrix.scheme }}
          PLATFORM_DESTINATION: ${{ matrix.destination }}
          PLATFORM_BUNDLE_IDENTIFIER: ${{ matrix.bundle_identifier }}
          PLATFORM_PROFILE_PLATFORM: ${{ matrix.profile_platform }}
          PLATFORM_REQUIRES_ALERT_ENTITLEMENTS: ${{ matrix.requires_alert_entitlements }}
          PLATFORM_PROFILE: ${{ secrets[matrix.profile_secret] }}
          PLATFORM_PROFILE_NAME: ${{ vars[matrix.profile_variable] }}
          IOS_CERTIFICATE: ${{ secrets.IOS_APP_STORE_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_APP_STORE_CERTIFICATE_PASSWORD }}
          IOS_RELEASE_API_BASE_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
          ARCHIVE_ONLY: ${{ inputs.archive_only }}
          UPLOAD_TO_TESTFLIGHT: ${{ inputs.upload_to_testflight }}
        run: |
          set -euo pipefail
          if [ "$ARCHIVE_ONLY" = "true" ] && [ "$UPLOAD_TO_TESTFLIGHT" = "true" ]; then
            echo "::error::Choose either archive_only or upload_to_testflight, not both"
            exit 1
          fi
          if [ "$ARCHIVE_ONLY" != "true" ] && [ "$UPLOAD_TO_TESTFLIGHT" != "true" ]; then
            echo "::error::Choose archive_only or upload_to_testflight"
            exit 1
          fi
          required=(
            PLATFORM_KEY
            PLATFORM_SCHEME
            PLATFORM_DESTINATION
            PLATFORM_BUNDLE_IDENTIFIER
            PLATFORM_PROFILE_PLATFORM
            PLATFORM_REQUIRES_ALERT_ENTITLEMENTS
            PLATFORM_PROFILE
            PLATFORM_PROFILE_NAME
            IOS_CERTIFICATE
            IOS_CERTIFICATE_PASSWORD
            IOS_RELEASE_API_BASE_URL
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::ios-app-store-release is missing selected $PLATFORM_KEY configuration: $(IFS=,; echo "${missing[*]}")"
            exit 1
          fi
          if [ "$IOS_RELEASE_API_BASE_URL" != "https://quakesignal-api.hopeso.workers.dev" ]; then
            echo "::error::IOS_RELEASE_API_BASE_URL must be https://quakesignal-api.hopeso.workers.dev"
            exit 1
          fi
          case "$PLATFORM_KEY" in
            tvos)
              test "$PLATFORM_SCHEME" = QuakeSignalTV
              test "$PLATFORM_DESTINATION" = generic/platform=tvOS
              test "$PLATFORM_PROFILE_PLATFORM" = tvOS
              test "$PLATFORM_REQUIRES_ALERT_ENTITLEMENTS" = false
              ;;
            visionos)
              test "$PLATFORM_SCHEME" = QuakeSignalVision
              test "$PLATFORM_DESTINATION" = generic/platform=visionOS
              test "$PLATFORM_PROFILE_PLATFORM" = visionOS
              test "$PLATFORM_REQUIRES_ALERT_ENTITLEMENTS" = true
              ;;
            *)
              echo "::error::Unsupported native platform $PLATFORM_KEY"
              exit 1
              ;;
          esac
          test "$PLATFORM_BUNDLE_IDENTIFIER" = com.quakesignal.app

      - name: Validate App Store Connect upload configuration
        if: ${{ inputs.upload_to_testflight && !inputs.archive_only }}
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER: ${{ vars.APP_STORE_CONNECT_API_ISSUER }}
        run: |
          set -euo pipefail
          required=(APP_STORE_CONNECT_KEY APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER)
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::ios-app-store-release is missing upload configuration: $(IFS=,; echo "${missing[*]}")"
            exit 1
          fi

      - name: Import Apple Distribution certificate and selected App Store profile
        env:
          PLATFORM_KEY: ${{ matrix.key }}
          PLATFORM_PROFILE: ${{ secrets[matrix.profile_secret] }}
          IOS_CERTIFICATE: ${{ secrets.IOS_APP_STORE_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_APP_STORE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/quakesignal-$PLATFORM_KEY.keychain-db"
          certificate="$RUNNER_TEMP/quakesignal-$PLATFORM_KEY-distribution.p12"
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          profile="$profile_dir/quakesignal-$PLATFORM_KEY.mobileprovision"
          keychain_password="$(uuidgen)"

          printf '%s' "$IOS_CERTIFICATE" | base64 -D > "$certificate"
          mkdir -p "$profile_dir"
          printf '%s' "$PLATFORM_PROFILE" | base64 -D > "$profile"
          chmod 600 "$certificate" "$profile"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security import "$certificate" -k "$keychain" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security find-identity -v -p codesigning "$keychain"

      - name: Archive selected signed App Store build
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          PLATFORM_KEY: ${{ matrix.key }}
          PLATFORM_SCHEME: ${{ matrix.scheme }}
          PLATFORM_DESTINATION: ${{ matrix.destination }}
          PLATFORM_PROFILE_NAME: ${{ vars[matrix.profile_variable] }}
          IOS_RELEASE_API_BASE_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
        run: >-
          xcodebuild archive
          -project "$XCODE_PROJECT"
          -scheme "$PLATFORM_SCHEME"
          -configuration Release
          -destination "$PLATFORM_DESTINATION"
          -archivePath "$RUNNER_TEMP/QuakeSignal-$PLATFORM_KEY.xcarchive"
          DEVELOPMENT_TEAM=5TT564H883
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY='Apple Distribution'
          QUAKESIGNAL_TV_PROFILE_NAME="$PLATFORM_PROFILE_NAME"
          QUAKESIGNAL_VISION_PROFILE_NAME="$PLATFORM_PROFILE_NAME"
          CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          QUAKESIGNAL_API_BASE_URL="$IOS_RELEASE_API_BASE_URL"

      - name: Export selected App Store Connect IPA
        env:
          PLATFORM_KEY: ${{ matrix.key }}
          PLATFORM_BUNDLE_IDENTIFIER: ${{ matrix.bundle_identifier }}
          PLATFORM_PROFILE_NAME: ${{ vars[matrix.profile_variable] }}
        run: |
          set -euo pipefail
          export_options="$RUNNER_TEMP/QuakeSignal-$PLATFORM_KEY-ExportOptions.plist"
          export_path="$RUNNER_TEMP/QuakeSignal-$PLATFORM_KEY-export"
          cp ios/AppStore/ExportOptions.plist "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$PLATFORM_BUNDLE_IDENTIFIER string $PLATFORM_PROFILE_NAME" "$export_options"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/QuakeSignal-$PLATFORM_KEY.xcarchive" \
            -exportOptionsPlist "$export_options" \
            -exportPath "$export_path"
          ipa=("$export_path"/*.ipa)
          if [ "${#ipa[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one exported $PLATFORM_KEY IPA"
            exit 1
          fi
          echo "IPA_PATH=${ipa[0]}" >> "$GITHUB_ENV"

      - name: Verify selected signed archive and exported IPA
        shell: bash
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          PLATFORM_KEY: ${{ matrix.key }}
          PLATFORM_BUNDLE_IDENTIFIER: ${{ matrix.bundle_identifier }}
          PLATFORM_PROFILE_NAME: ${{ vars[matrix.profile_variable] }}
          PLATFORM_PROFILE_PLATFORM: ${{ matrix.profile_platform }}
          PLATFORM_REQUIRES_ALERT_ENTITLEMENTS: ${{ matrix.requires_alert_entitlements }}
        run: |
          set -euo pipefail
          expected_team="5TT564H883"
          expected_application_identifier="$expected_team.$PLATFORM_BUNDLE_IDENTIFIER"
          archive="$RUNNER_TEMP/QuakeSignal-$PLATFORM_KEY.xcarchive"
          verification_dir="$(mktemp -d "$RUNNER_TEMP/quakesignal-$PLATFORM_KEY-signing.XXXXXX")"
          trap 'rm -rf "$verification_dir"' EXIT

          assert_plist_value() {
            local plist="$1"
            local key="$2"
            local expected="$3"
            local label="$4"
            local actual
            if ! actual="$(/usr/libexec/PlistBuddy -c "Print :$key" "$plist" 2>/dev/null)"; then
              echo "::error::$label is missing required key $key"
              return 1
            fi
            if [ "$actual" != "$expected" ]; then
              echo "::error::$label has unexpected $key value $actual"
              return 1
            fi
          }

          assert_plist_array_contains() {
            local plist="$1"
            local key="$2"
            local expected="$3"
            local label="$4"
            local index=0
            local actual
            while actual="$(/usr/libexec/PlistBuddy -c "Print :$key:$index" "$plist" 2>/dev/null)"; do
              if [ "$actual" = "$expected" ]; then return 0; fi
              index=$((index + 1))
            done
            echo "::error::$label does not include $expected in $key"
            return 1
          }

          assert_capability_absent() {
            local plist="$1"
            local key="$2"
            local label="$3"
            if /usr/libexec/PlistBuddy -c "Print :$key" "$plist" >/dev/null 2>&1; then
              echo "::error::$label unexpectedly contains foreground-only capability $key"
              return 1
            fi
          }

          verify_platform_app() {
            local label="$1"
            local app="$2"
            local entitlements="$verification_dir/$label-entitlements.plist"
            local profile="$app/embedded.mobileprovision"
            local profile_plist="$verification_dir/$label-profile.plist"

            test -d "$app" || { echo "::error::$label app bundle is missing"; return 1; }
            test -f "$app/Info.plist" || { echo "::error::$label Info.plist is missing"; return 1; }
            test -f "$profile" || { echo "::error::$label embedded profile is missing"; return 1; }
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dvv "$app" 2>&1 | grep -Fqx "TeamIdentifier=$expected_team"
            codesign -dvv "$app" 2>&1 | grep -Fq 'Authority=Apple Distribution'
            assert_plist_value "$app/Info.plist" CFBundleIdentifier "$PLATFORM_BUNDLE_IDENTIFIER" "$label Info.plist"
            assert_plist_value "$app/Info.plist" CFBundleVersion "$BUILD_NUMBER" "$label Info.plist"

            codesign -d --entitlements :- "$app" > "$entitlements" 2>/dev/null
            plutil -lint "$entitlements" >/dev/null
            assert_plist_value "$entitlements" application-identifier "$expected_application_identifier" "$label signed entitlements"
            assert_plist_value "$entitlements" com.apple.developer.team-identifier "$expected_team" "$label signed entitlements"

            security cms -D -i "$profile" > "$profile_plist"
            plutil -lint "$profile_plist" >/dev/null
            assert_plist_value "$profile_plist" Name "$PLATFORM_PROFILE_NAME" "$label provisioning profile"
            assert_plist_value "$profile_plist" ApplicationIdentifierPrefix:0 "$expected_team" "$label provisioning profile"
            assert_plist_value "$profile_plist" TeamIdentifier:0 "$expected_team" "$label provisioning profile"
            assert_plist_value "$profile_plist" Entitlements:application-identifier "$expected_application_identifier" "$label provisioning profile"
            assert_plist_value "$profile_plist" Entitlements:com.apple.developer.team-identifier "$expected_team" "$label provisioning profile"
            if [ "$PLATFORM_KEY" = visionos ]; then
              if ! assert_plist_array_contains "$profile_plist" Platform visionOS "$label provisioning profile" 2>/dev/null &&
                 ! assert_plist_array_contains "$profile_plist" Platform xrOS "$label provisioning profile"; then
                echo "::error::$label provisioning profile is not authorized for visionOS"
                return 1
              fi
            else
              assert_plist_array_contains "$profile_plist" Platform "$PLATFORM_PROFILE_PLATFORM" "$label provisioning profile"
            fi

            if [ "$PLATFORM_REQUIRES_ALERT_ENTITLEMENTS" = true ]; then
              assert_plist_value "$entitlements" aps-environment production "$label signed entitlements"
              assert_plist_value "$entitlements" com.apple.developer.devicecheck.appattest-environment production "$label signed entitlements"
              assert_plist_value "$entitlements" com.apple.developer.usernotifications.time-sensitive true "$label signed entitlements"
              assert_plist_value "$profile_plist" Entitlements:aps-environment production "$label provisioning profile"
              assert_plist_array_contains "$profile_plist" Entitlements:com.apple.developer.devicecheck.appattest-environment production "$label provisioning profile"
              assert_plist_value "$profile_plist" Entitlements:com.apple.developer.usernotifications.time-sensitive true "$label provisioning profile"
            else
              for capability in aps-environment com.apple.developer.devicecheck.appattest-environment com.apple.developer.usernotifications.time-sensitive; do
                assert_capability_absent "$entitlements" "$capability" "$label signed entitlements"
                assert_capability_absent "$profile_plist" "Entitlements:$capability" "$label provisioning profile"
              done
            fi
          }

          shopt -s nullglob
          archive_apps=("$archive"/Products/Applications/*.app)
          if [ "${#archive_apps[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one app in the $PLATFORM_KEY archive"
            exit 1
          fi
          ipa_path="${IPA_PATH:?IPA_PATH is not set after export}"
          test -f "$ipa_path" || { echo "::error::Exported IPA is missing"; exit 1; }
          ipa_root="$verification_dir/ipa"
          mkdir -p "$ipa_root"
          ditto -x -k "$ipa_path" "$ipa_root"
          ipa_apps=("$ipa_root"/Payload/*.app)
          if [ "${#ipa_apps[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one app in the exported $PLATFORM_KEY IPA"
            exit 1
          fi
          verify_platform_app archive "${archive_apps[0]}"
          verify_platform_app ipa "${ipa_apps[0]}"

      - name: Upload selected build to TestFlight
        if: ${{ inputs.upload_to_testflight && !inputs.archive_only }}
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER: ${{ vars.APP_STORE_CONNECT_API_ISSUER }}
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/appstore-private-keys"
          key_path="$key_dir/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          mkdir -p "$key_dir"
          cleanup() {
            rm -f "$key_path"
            rmdir "$key_dir" 2>/dev/null || true
          }
          trap cleanup EXIT
          printf '%s' "$APP_STORE_CONNECT_KEY" > "$key_path"
          chmod 600 "$key_path"
          export API_PRIVATE_KEYS_DIR="$key_dir"
          xcrun altool --upload-package "$IPA_PATH" \
            --api-key "$APP_STORE_CONNECT_KEY_ID" \
            --api-issuer "$APP_STORE_CONNECT_ISSUER" \
            --output-format json

      - name: Upload selected IPA as a private workflow artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quakesignal-${{ matrix.key }}-app-store-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove signing material
        if: always()
        env:
          PLATFORM_KEY: ${{ matrix.key }}
        run: |
          rm -f "$RUNNER_TEMP/quakesignal-$PLATFORM_KEY-distribution.p12"
          rm -f "$RUNNER_TEMP/QuakeSignal-$PLATFORM_KEY-ExportOptions.plist"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/quakesignal-$PLATFORM_KEY.mobileprovision"
          rmdir "$RUNNER_TEMP/appstore-private-keys" 2>/dev/null || true
          security delete-keychain "$RUNNER_TEMP/quakesignal-$PLATFORM_KEY.keychain-db" 2>/dev/null || true
