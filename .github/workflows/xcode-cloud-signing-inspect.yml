name: Inspect Xcode Cloud signing prerequisites

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect the linked Xcode Cloud product
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'TastyHeadphones/QuakeSignal' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected
    runs-on: macos-latest
    environment:
      name: ios-app-store-release

    steps:
      - name: Query the App Store Connect Xcode Cloud resources
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER: ${{ vars.APP_STORE_CONNECT_API_ISSUER }}
          APP_STORE_CONNECT_APP_ID: '6800642443'
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('crypto');

          (async () => {

          const required = [
            'APP_STORE_CONNECT_API_KEY',
            'APP_STORE_CONNECT_API_KEY_ID',
            'APP_STORE_CONNECT_API_ISSUER',
            'APP_STORE_CONNECT_APP_ID',
          ];
          for (const key of required) {
            if (!process.env[key]) throw new Error(`missing protected configuration: ${key}`);
          }

          const base64url = (value) => Buffer.from(value).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const header = base64url(JSON.stringify({ alg: 'ES256', kid: process.env.APP_STORE_CONNECT_API_KEY_ID, typ: 'JWT' }));
          const payload = base64url(JSON.stringify({
            iss: process.env.APP_STORE_CONNECT_API_ISSUER,
            iat: now,
            exp: now + 600,
            aud: 'appstoreconnect-v1',
          }));
          const signingInput = `${header}.${payload}`;
          const privateKey = crypto.createPrivateKey(
            process.env.APP_STORE_CONNECT_API_KEY.replace(/\\n/g, '\n'),
          );
          const signature = crypto.sign('sha256', Buffer.from(signingInput), {
            key: privateKey,
            dsaEncoding: 'ieee-p1363',
          });
          const token = `${signingInput}.${signature.toString('base64url')}`;

          async function get(path) {
            const response = await fetch(`https://api.appstoreconnect.apple.com${path}`, {
              headers: { Authorization: `Bearer ${token}` },
            });
            if (!response.ok) {
              throw new Error(`App Store Connect request ${path} failed with HTTP ${response.status}`);
            }
            return response.json();
          }

          function resourceSummary(resource) {
            return {
              type: resource.type,
              id: resource.id,
              attributes: resource.attributes || {},
              relationships: Object.fromEntries(Object.entries(resource.relationships || {}).map(([name, value]) => [
                name,
                value.data == null ? null : Array.isArray(value.data)
                  ? value.data.map(({ type, id }) => ({ type, id }))
                  : { type: value.data.type, id: value.data.id },
              ])),
            };
          }

          const appID = encodeURIComponent(process.env.APP_STORE_CONNECT_APP_ID);
          const products = await get(`/v1/ciProducts?filter[app]=${appID}&include=app,primaryRepositories&limit=200`);
          const product = products.data.find((item) => item.relationships?.app?.data?.id === process.env.APP_STORE_CONNECT_APP_ID);
          if (!product) throw new Error('no Xcode Cloud product is linked to the QuakeSignal App Store Connect app');

          const repositoryReferences = product.relationships?.primaryRepositories?.data || [];
          const repositories = [];
          for (const reference of repositoryReferences) {
            repositories.push(resourceSummary(await get(`/v1/scmRepositories/${encodeURIComponent(reference.id)}?include=scmProvider,defaultBranch`)));
          }

          const [xcodeVersions, macOSVersions, workflows] = await Promise.all([
            get('/v1/ciXcodeVersions?include=macOsVersions&limit=200'),
            get('/v1/ciMacOsVersions?include=xcodeVersions&limit=200'),
            get(`/v1/ciProducts/${encodeURIComponent(product.id)}/workflows?limit=200`),
          ]);

          const report = {
            appStoreConnectAppID: process.env.APP_STORE_CONNECT_APP_ID,
            product: resourceSummary(product),
            repositories,
            workflows: workflows.data.map(resourceSummary),
            xcodeVersions: xcodeVersions.data.map(resourceSummary),
            macOSVersions: macOSVersions.data.map(resourceSummary),
          };
          console.log(JSON.stringify(report, null, 2));
          })().catch((error) => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE

  inspect-profile:
    name: Inspect iOS App Store Critical Alerts capability
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'TastyHeadphones/QuakeSignal' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected
    runs-on: macos-latest
    environment:
      name: ios-app-store-release
    steps:
      - name: Inspect bundle capabilities and stored profile entitlements
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER: ${{ vars.APP_STORE_CONNECT_API_ISSUER }}
          IOS_APP_STORE_PROVISIONING_PROFILE: ${{ secrets.IOS_APP_STORE_PROVISIONING_PROFILE }}
          IOS_APP_STORE_PROFILE_NAME: ${{ vars.IOS_APP_STORE_PROFILE_NAME }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const { spawnSync } = require('child_process');

          (async () => {
            const required = [
              'APP_STORE_CONNECT_API_KEY',
              'APP_STORE_CONNECT_API_KEY_ID',
              'APP_STORE_CONNECT_API_ISSUER',
              'IOS_APP_STORE_PROVISIONING_PROFILE',
            ];
            for (const key of required) {
              if (!process.env[key]) throw new Error(`missing protected configuration: ${key}`);
            }

            const base64url = (value) => Buffer.from(value).toString('base64url');
            const now = Math.floor(Date.now() / 1000);
            const header = base64url(JSON.stringify({
              alg: 'ES256',
              kid: process.env.APP_STORE_CONNECT_API_KEY_ID,
              typ: 'JWT',
            }));
            const payload = base64url(JSON.stringify({
              iss: process.env.APP_STORE_CONNECT_API_ISSUER,
              iat: now,
              exp: now + 600,
              aud: 'appstoreconnect-v1',
            }));
            const signingInput = `${header}.${payload}`;
            const privateKey = crypto.createPrivateKey(
              process.env.APP_STORE_CONNECT_API_KEY.replace(/\\n/g, '\n'),
            );
            const signature = crypto.sign('sha256', Buffer.from(signingInput), {
              key: privateKey,
              dsaEncoding: 'ieee-p1363',
            });
            const token = `${signingInput}.${signature.toString('base64url')}`;

            async function api(method, path, body) {
              const response = await fetch(`https://api.appstoreconnect.apple.com${path}`, {
                method,
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: 'application/json',
                  ...(body ? { 'Content-Type': 'application/json' } : {}),
                },
                body: body ? JSON.stringify(body) : undefined,
              });
              const text = await response.text();
              let json = null;
              try { json = text ? JSON.parse(text) : null; } catch { json = { raw: text.slice(0, 500) }; }
              return { status: response.status, json };
            }

            function entitlementKeysFromProfile(base64Profile) {
              const raw = Buffer.from(base64Profile.replace(/\s+/g, ''), 'base64');
              const profilePath = `${process.env.RUNNER_TEMP}/quakesignal-inspect.mobileprovision`;
              const plistPath = `${process.env.RUNNER_TEMP}/quakesignal-inspect.plist`;
              fs.writeFileSync(profilePath, raw);
              const decoded = spawnSync('security', ['cms', '-D', '-i', profilePath, '-o', plistPath], {
                encoding: 'utf8',
              });
              if (decoded.status !== 0) {
                throw new Error(`security cms failed: ${decoded.stderr || decoded.stdout}`);
              }
              const dumped = spawnSync('plutil', ['-extract', 'Entitlements', 'json', '-o', '-', plistPath], {
                encoding: 'utf8',
              });
              if (dumped.status !== 0) {
                throw new Error(`plutil failed: ${dumped.stderr || dumped.stdout}`);
              }
              const entitlements = JSON.parse(dumped.stdout);
              return Object.keys(entitlements).sort();
            }

            const storedKeys = entitlementKeysFromProfile(process.env.IOS_APP_STORE_PROVISIONING_PROFILE);
            const bundles = await api('GET', '/v1/bundleIds?filter[identifier]=com.quakesignal.app&limit=200');
            if (bundles.status !== 200) {
              throw new Error(`listing bundle IDs failed (${bundles.status}): ${JSON.stringify(bundles.json)}`);
            }
            const bundle = (bundles.json.data || []).find((item) => item.attributes?.identifier === 'com.quakesignal.app');
            if (!bundle) throw new Error('com.quakesignal.app bundle ID was not returned by App Store Connect');

            const capabilities = await api(
              'GET',
              `/v1/bundleIds/${encodeURIComponent(bundle.id)}/bundleIdCapabilities?limit=200`,
            );
            if (capabilities.status !== 200) {
              throw new Error(`listing capabilities failed (${capabilities.status}): ${JSON.stringify(capabilities.json)}`);
            }
            const capabilityTypes = (capabilities.json.data || [])
              .map((item) => item.attributes?.capabilityType)
              .filter(Boolean)
              .sort();

            const enableAttempts = [];
            for (const capabilityType of [
              'CRITICAL_ALERTS',
              'USERNOTIFICATIONS_CRITICAL_ALERTS',
              'USENOTIFICATIONS_CRITICAL_ALERTS',
              'CRITICAL_ALERT',
            ]) {
              const created = await api('POST', '/v1/bundleIdCapabilities', {
                data: {
                  type: 'bundleIdCapabilities',
                  attributes: { capabilityType },
                  relationships: {
                    bundleId: { data: { type: 'bundleIds', id: bundle.id } },
                  },
                },
              });
              enableAttempts.push({
                capabilityType,
                status: created.status,
                detail: created.json?.errors?.[0]?.detail || created.json?.errors?.[0]?.title || null,
              });
            }

            const refreshed = await api(
              'GET',
              `/v1/bundleIds/${encodeURIComponent(bundle.id)}/bundleIdCapabilities?limit=200`,
            );
            const refreshedTypes = (refreshed.json.data || [])
              .map((item) => item.attributes?.capabilityType)
              .filter(Boolean)
              .sort();

            const report = {
              bundleId: bundle.id,
              identifier: bundle.attributes?.identifier,
              storedProfileName: process.env.IOS_APP_STORE_PROFILE_NAME || null,
              storedProfileEntitlementKeys: storedKeys,
              storedProfileHasCriticalAlerts: storedKeys.includes(
                'com.apple.developer.usernotifications.critical-alerts',
              ),
              portalCapabilityTypes: capabilityTypes,
              enableAttempts,
              portalCapabilityTypesAfterEnable: refreshedTypes,
              portalHasCriticalAlertsCapability: refreshedTypes.some((value) => /CRITICAL/i.test(value)),
            };
            console.log(JSON.stringify(report, null, 2));
            if (!report.portalHasCriticalAlertsCapability) {
              console.error(
                'Apple has not granted Critical Alerts on com.quakesignal.app. The Account Holder must submit https://developer.apple.com/contact/request/notifications-critical-alerts-entitlement/ and then regenerate IOS_APP_STORE_PROVISIONING_PROFILE.',
              );
              process.exitCode = 2;
            }
          })().catch((error) => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE
