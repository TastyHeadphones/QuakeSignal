name: Desktop release

# Tagged releases build QuakeSignal for Windows and macOS. Windows is packaged
# as MSIX and submitted directly to Microsoft Store, which signs the package
# after certification. No third-party code-signing key is used or stored here.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    # Builds an MSIX artifact for the initial manual Store submission. Store
    # publishing runs only for a version tag, after the app is live.

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  UPSTREAM_REPOSITORY: TastyHeadphones/QuakeSignal
  # Assigned by Partner Center for the MSIX Store product. These are public
  # package-manifest values, not credentials.
  MSIX_IDENTITY_NAME: tastyheadphones.QuakeSignal
  MSIX_PUBLISHER: CN=EFC77215-2E59-452D-86F8-5990C0BA641E
  MSIX_PUBLISHER_DISPLAY_NAME: tastyheadphones

jobs:
  windows:
    name: Windows MSIX
    runs-on: windows-latest
    env:
      RUST_TARGET: x86_64-pc-windows-msvc

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-05
        with:
          toolchain: stable
          targets: ${{ env.RUST_TARGET }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Resolve application version
        shell: bash
        run: |
          config_version="$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")"
          if [ -z "$config_version" ] || [ "$config_version" = "undefined" ]; then
            echo "::error::Could not read version from desktop/src-tauri/tauri.conf.json"
            exit 1
          fi
          if [[ ! "$config_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::MSIX releases require a numeric major.minor.patch version; found $config_version"
            exit 1
          fi
          echo "APP_VERSION=$config_version" >> "$GITHUB_ENV"
          echo "MSIX_VERSION=$config_version.0" >> "$GITHUB_ENV"

      - name: Verify tag matches tauri.conf.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$APP_VERSION" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $APP_VERSION"
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Test Rust core
        working-directory: desktop/src-tauri
        run: cargo test --locked

      - name: Build Windows application
        working-directory: desktop
        run: npm run tauri -- build --no-bundle --target ${{ env.RUST_TARGET }}

      - name: Package MSIX for Microsoft Store
        shell: pwsh
        run: |
          $releaseDir = "desktop/src-tauri/target/${env:RUST_TARGET}/release"
          $exe = @("QuakeSignal.exe", "desktop.exe") |
            ForEach-Object {
              $candidate = Join-Path $releaseDir $_
              if (Test-Path $candidate) { Get-Item $candidate }
            } |
            Select-Object -First 1
          if (-not $exe) { throw "Main application binary not found under $releaseDir" }

          $makeAppx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
            Sort-Object Name -Descending |
            ForEach-Object {
              $candidate = Join-Path $_.FullName "x64\MakeAppx.exe"
              if (Test-Path $candidate) { Get-Item $candidate }
            } |
            Select-Object -First 1
          if (-not $makeAppx) { throw "MakeAppx.exe was not found on the Windows runner" }

          $outDir = Join-Path $env:GITHUB_WORKSPACE "artifacts/windows"
          $packageRoot = Join-Path $outDir "msix-root"
          $assets = Join-Path $packageRoot "Assets"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          Copy-Item $exe.FullName (Join-Path $packageRoot "QuakeSignal.exe") -Force
          Get-ChildItem $releaseDir -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $packageRoot -Force

          foreach ($assetName in @("StoreLogo.png", "Square44x44Logo.png", "Square150x150Logo.png")) {
            Copy-Item "desktop/src-tauri/icons/$assetName" (Join-Path $assets $assetName) -Force
          }

          @"
          <?xml version="1.0" encoding="utf-8"?>
          <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
                   xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"
                   IgnorableNamespaces="uap">
            <Identity Name="${env:MSIX_IDENTITY_NAME}"
                      Publisher="${env:MSIX_PUBLISHER}"
                      Version="${env:MSIX_VERSION}"
                      ProcessorArchitecture="x64" />
            <Properties>
              <DisplayName>QuakeSignal</DisplayName>
              <PublisherDisplayName>${env:MSIX_PUBLISHER_DISPLAY_NAME}</PublisherDisplayName>
              <Logo>Assets\StoreLogo.png</Logo>
            </Properties>
            <Resources>
              <Resource Language="en-us" />
            </Resources>
            <Dependencies>
              <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.26100.0" />
            </Dependencies>
            <Applications>
              <Application Id="App" Executable="QuakeSignal.exe" EntryPoint="Windows.FullTrustApplication">
                <uap:VisualElements DisplayName="QuakeSignal"
                                    Description="Local-first desktop earthquake monitor"
                                    Square150x150Logo="Assets\Square150x150Logo.png"
                                    Square44x44Logo="Assets\Square44x44Logo.png"
                                    BackgroundColor="transparent" />
              </Application>
            </Applications>
            <Capabilities>
              <Capability Name="internetClient" />
            </Capabilities>
          </Package>
          "@ | Set-Content -Path (Join-Path $packageRoot "AppxManifest.xml") -Encoding utf8

          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $packagePath = Join-Path $outDir "QuakeSignal_${env:APP_VERSION}_x64.msix"
          & $makeAppx.FullName pack /d $packageRoot /p $packagePath /o
          if ($LASTEXITCODE -ne 0) { throw "MakeAppx failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path $packagePath)) { throw "MSIX package was not produced" }
          Get-FileHash $packagePath -Algorithm SHA256 | Format-List

      - name: Upload MSIX package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-msix
          path: ${{ github.workspace }}/artifacts/windows/*.msix
          if-no-files-found: error

  macos:
    name: macOS universal
    runs-on: macos-latest
    env:
      RUST_TARGET: universal-apple-darwin

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-05
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Test Rust core
        working-directory: desktop/src-tauri
        run: cargo test --locked

      - name: Build universal macOS bundles
        working-directory: desktop
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri -- build --target ${{ env.RUST_TARGET }} --bundles app,dmg

      - name: Collect release artifacts
        run: |
          set -euo pipefail
          bundle_dir="desktop/src-tauri/target/${RUST_TARGET}/release/bundle"
          mkdir -p dist
          shopt -s nullglob
          dmgs=("$bundle_dir"/dmg/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "::error::No .dmg produced under $bundle_dir/dmg"
            exit 1
          fi
          cp "${dmgs[@]}" dist/

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-macos
          path: dist
          if-no-files-found: error

  release:
    name: Publish release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download macOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-macos
          path: dist

      - name: Generate SHA256 checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- * > SHA256SUMS.txt

      - name: Compose release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          previous="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty' || true)"
          if [ "$previous" = "$tag" ]; then previous=""; fi
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$tag" \
            ${previous:+-f previous_tag_name="$previous"} \
            --jq '.body' > generated-notes.md || : > generated-notes.md
          python3 .github/scripts/render-release-notes.py

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release create "$tag" dist/* --title "QuakeSignal $tag" --notes-file release-notes.md; then
            echo "Created release $tag"
          else
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --notes-file release-notes.md
          fi

  microsoft-store:
    name: Submit MSIX to Microsoft Store
    needs: windows
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      github.repository == 'TastyHeadphones/QuakeSignal' &&
      vars.MICROSOFT_STORE_PRODUCT_ID != ''
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      STORE_PRODUCT_ID: ${{ vars.MICROSOFT_STORE_PRODUCT_ID }}
      AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
      AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
      AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
      SELLER_ID: ${{ secrets.SELLER_ID }}

    steps:
      - name: Download MSIX package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-msix
          path: store-package

      - name: Configure Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@15abd1c50fcc164b19cb240fb04ef3c49bf715a2 # v1.1

      - name: Configure Partner Center credentials
        shell: pwsh
        run: |
          $missing = @()
          foreach ($name in @("STORE_PRODUCT_ID", "AZURE_AD_TENANT_ID", "AZURE_AD_APPLICATION_CLIENT_ID", "AZURE_AD_APPLICATION_SECRET", "SELLER_ID")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { $missing += $name }
          }
          if ($missing.Count -gt 0) { throw "Microsoft Store configuration is incomplete. Missing: $($missing -join ', ')" }
          msstore reconfigure `
            --tenantId "$env:AZURE_AD_TENANT_ID" `
            --sellerId "$env:SELLER_ID" `
            --clientId "$env:AZURE_AD_APPLICATION_CLIENT_ID" `
            --clientSecret "$env:AZURE_AD_APPLICATION_SECRET"

      - name: Publish MSIX package
        shell: pwsh
        run: |
          $package = Get-ChildItem store-package -Filter *.msix -File | Select-Object -First 1
          if (-not $package) { throw "No MSIX package was downloaded" }
          msstore publish $package.FullName -id "$env:STORE_PRODUCT_ID"
