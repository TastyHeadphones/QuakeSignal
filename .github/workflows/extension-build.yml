name: Chrome extension

# This workflow intentionally creates only Actions artifacts. The protected
# desktop-release workflow owns public GitHub Release creation and its signed
# macOS checksum manifest, so an extension tag can never race or mutate it.

on:
  push:
    branches:
      - main
      - "codex/**"
    tags:
      - "v*"
    paths:
      - "extension/**"
      - ".github/workflows/extension-build.yml"
  pull_request:
    paths:
      - "extension/**"
      - ".github/workflows/extension-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Test extension core
        working-directory: extension
        run: npm test

      - name: Package Web Store ZIP
        working-directory: extension
        run: npm run package

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quakesignal-chrome
          path: extension/dist/*.zip
          if-no-files-found: error
