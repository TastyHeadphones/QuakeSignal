name: Chrome extension

on:
  push:
    branches:
      - main
      - "codex/**"
    tags:
      - "v*"
    paths:
      - "extension/**"
      - ".github/workflows/extension-build.yml"
  pull_request:
    paths:
      - "extension/**"
      - ".github/workflows/extension-build.yml"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test extension core
        working-directory: extension
        run: npm test

      - name: Package Web Store ZIP
        working-directory: extension
        run: npm run package

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: quakesignal-chrome
          path: extension/dist/*.zip
          if-no-files-found: error

      - name: Add package to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: extension/dist/*.zip
