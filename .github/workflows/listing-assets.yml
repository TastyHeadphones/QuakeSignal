name: Store listing assets

on:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "assets/app-icon.svg"
      - "ios/AppStore/**"
      - "ios/ScreenshotAutomation/**"
      - "ios/QuakeSignal/**"
      - "ios/QuakeSignalShared/**"
      - "ios/QuakeSignalTV/**"
      - "ios/QuakeSignalVision/**"
      - "ios/QuakeSignalWatch/**"
      - "ios/project.yml"
      - "ios/QuakeSignal.xcodeproj/project.pbxproj"
      - "ios/QuakeSignal.xcodeproj/project.xcworkspace/contents.xcworkspacedata"
      - "ios/QuakeSignal.xcodeproj/xcshareddata/xcschemes/QuakeSignal.xcscheme"
      - "ios/QuakeSignal.xcodeproj/xcshareddata/xcschemes/**"
      - "desktop/AppStore/**"
      - ".github/scripts/verify-store-assets.rb"
      - ".github/scripts/verify-store-assets.test.rb"
      - ".github/scripts/verify-ios-screenshot-candidates.rb"
      - ".github/scripts/verify-ios-screenshot-candidates.test.rb"
      - ".github/scripts/verify-native-apple-screenshot-candidates.rb"
      - ".github/scripts/verify-native-apple-screenshot-candidates.test.rb"
      - ".github/scripts/verify-apple-screenshot-release-set.rb"
      - ".github/scripts/verify-apple-screenshot-release-set.test.rb"
      - ".github/scripts/verify-ios-release-contract.mjs"
      - ".github/scripts/verify-ios-release-contract.test.mjs"
      - ".github/workflows/apple-platform-screenshots.yml"
      - ".github/workflows/listing-assets.yml"
      - ".github/workflows/workflow-lint.yml"
  pull_request:
    paths:
      - "assets/app-icon.svg"
      - "ios/AppStore/**"
      - "ios/ScreenshotAutomation/**"
      - "ios/QuakeSignal/**"
      - "ios/QuakeSignalShared/**"
      - "ios/QuakeSignalTV/**"
      - "ios/QuakeSignalVision/**"
      - "ios/QuakeSignalWatch/**"
      - "ios/project.yml"
      - "ios/QuakeSignal.xcodeproj/project.pbxproj"
      - "ios/QuakeSignal.xcodeproj/project.xcworkspace/contents.xcworkspacedata"
      - "ios/QuakeSignal.xcodeproj/xcshareddata/xcschemes/QuakeSignal.xcscheme"
      - "ios/QuakeSignal.xcodeproj/xcshareddata/xcschemes/**"
      - "desktop/AppStore/**"
      - ".github/scripts/verify-store-assets.rb"
      - ".github/scripts/verify-store-assets.test.rb"
      - ".github/scripts/verify-ios-screenshot-candidates.rb"
      - ".github/scripts/verify-ios-screenshot-candidates.test.rb"
      - ".github/scripts/verify-native-apple-screenshot-candidates.rb"
      - ".github/scripts/verify-native-apple-screenshot-candidates.test.rb"
      - ".github/scripts/verify-apple-screenshot-release-set.rb"
      - ".github/scripts/verify-apple-screenshot-release-set.test.rb"
      - ".github/scripts/verify-ios-release-contract.mjs"
      - ".github/scripts/verify-ios-release-contract.test.mjs"
      - ".github/workflows/apple-platform-screenshots.yml"
      - ".github/workflows/listing-assets.yml"
      - ".github/workflows/workflow-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate listing metadata and screenshots
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate listing assets
        run: ruby .github/scripts/verify-store-assets.rb

      - name: Test listing asset validator
        run: ruby .github/scripts/verify-store-assets.test.rb

      - name: Test historical iOS screenshot validator
        run: ruby .github/scripts/verify-ios-screenshot-candidates.test.rb

      - name: Validate historical iOS screenshot bytes
        run: ruby .github/scripts/verify-ios-screenshot-candidates.rb

      - name: Test historical native Apple screenshot validator
        run: ruby .github/scripts/verify-native-apple-screenshot-candidates.test.rb

      - name: Validate historical native Apple screenshot bytes
        run: ruby .github/scripts/verify-native-apple-screenshot-candidates.rb

      - name: Test source-addressed Apple screenshot release set
        run: ruby .github/scripts/verify-apple-screenshot-release-set.test.rb

      - name: Validate source-addressed Apple screenshot release set
        run: ruby .github/scripts/verify-apple-screenshot-release-set.rb
