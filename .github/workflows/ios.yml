name: Apple platform builds and iOS release

on:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      - ".github/workflows/apple-platforms.yml"
      - ".github/workflows/cloudflare.yml"
      - ".github/scripts/verify-ios-build-split.sh"
      - ".github/scripts/verify-ios-release-contract.mjs"
      - ".github/scripts/verify-ios-release-contract.test.mjs"
      - ".github/scripts/test_xcode_cloud_release_guard.py"
      - ".github/scripts/verify-signed-apple-artifacts.test.sh"
      - "backend/cloudflare/wrangler.jsonc"
      - "backend/cloudflare/scripts/smoke-test.mjs"
      - "backend/cloudflare/scripts/smoke-test-policy.mjs"
      - "backend/cloudflare/scripts/wait-for-worker-readiness.mjs"
      - "backend/cloudflare/scripts/wait-for-worker-readiness.test.mjs"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      - ".github/workflows/apple-platforms.yml"
      - ".github/workflows/cloudflare.yml"
      - ".github/scripts/verify-ios-build-split.sh"
      - ".github/scripts/verify-ios-release-contract.mjs"
      - ".github/scripts/verify-ios-release-contract.test.mjs"
      - ".github/scripts/test_xcode_cloud_release_guard.py"
      - ".github/scripts/verify-signed-apple-artifacts.test.sh"
      - "backend/cloudflare/wrangler.jsonc"
      - "backend/cloudflare/scripts/smoke-test.mjs"
      - "backend/cloudflare/scripts/smoke-test-policy.mjs"
      - "backend/cloudflare/scripts/wait-for-worker-readiness.mjs"
      - "backend/cloudflare/scripts/wait-for-worker-readiness.test.mjs"
  workflow_dispatch:
    inputs:
      archive_only:
        description: Archive, verify, and hash a signed IPA without retaining or uploading it
        required: false
        default: false
        type: boolean
      upload_to_testflight:
        description: Archive, sign, and upload a new build to TestFlight
        required: false
        default: false
        type: boolean
      assign_testflight_groups:
        description: Assign the processed TestFlight build to every App Store Connect tester group
        required: false
        default: false
        type: boolean
      build_number:
        description: Exact pre-approved CFBundleVersion from ios/project.yml and the Worker App Attest allow-list
        required: false
        default: "22"
        type: string
      source_commit:
        description: Exact 40-character lowercase protected-main commit to sign
        required: true
        type: string

concurrency:
  # A manual signed archive or TestFlight upload must not be cancelled by an
  # ordinary main push.
  # CI runs remain coalesced by ref, while dispatches use an isolated lane.
  group: ios-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  XCODE_PROJECT: ios/QuakeSignal.xcodeproj
  XCODE_SCHEME: QuakeSignal
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  test:
    name: Build and test iOS
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify iOS and Worker release contract
        run: node .github/scripts/verify-ios-release-contract.mjs

      - name: Test Xcode Cloud release guards and signed artifact verifier
        run: |
          set -euo pipefail
          bash -n ios/ci_scripts/ci_post_clone.sh \
            ios/ci_scripts/ci_pre_xcodebuild.sh \
            ios/ci_scripts/ci_post_xcodebuild.sh \
            ios/ci_scripts/verify-signed-apple-artifacts.sh \
            .github/scripts/verify-signed-apple-artifacts.test.sh
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_xcode_cloud_release_guard.py
          .github/scripts/verify-signed-apple-artifacts.test.sh

      - name: Install checksum-pinned XcodeGen
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen.zip"
          install_root="$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $archive" | shasum -a 256 -c -
          mkdir -p "$install_root"
          ditto -x -k "$archive" "$install_root"
          echo "$install_root/xcodegen/bin" >> "$GITHUB_PATH"
          "$install_root/xcodegen/bin/xcodegen" --version

      - name: Regenerate Xcode project and verify it is committed
        working-directory: ios
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          git diff --exit-code -- QuakeSignal.xcodeproj/project.pbxproj
          test -z "$(git status --porcelain --untracked-files=all -- QuakeSignal.xcodeproj)"

      - name: Select an installed iOS simulator
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available -j | ruby -rjson -e '
            runtimes = JSON.parse(STDIN.read).fetch("devices")
            devices = runtimes
              .select { |runtime, _| runtime.include?(".iOS-") }
              .values
              .flatten
              .select { |device| device["isAvailable"] }
            abort "No available iOS Simulator" if devices.empty?
            puts devices.first.fetch("udid")
          ')"
          echo "IOS_DESTINATION=platform=iOS Simulator,id=$simulator_id" >> "$GITHUB_ENV"

      - name: Build and run unit tests on an iOS simulator
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination "$IOS_DESTINATION" \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild-test.log

      - name: Build and verify the public unsigned Release configuration
        run: |
          set -euo pipefail
          set -o pipefail
          release_derived_data="$RUNNER_TEMP/quakesignal-ios-release-derived-data"
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "$IOS_DESTINATION" \
            -derivedDataPath "$release_derived_data" \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild-release.log

          xcodebuild -showBuildSettings \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphonesimulator > release-build-settings.txt
          grep -F 'PRODUCT_BUNDLE_IDENTIFIER = com.quakesignal.app' release-build-settings.txt
          grep -F 'QUAKESIGNAL_API_BASE_URL = https://quakesignal-api.hopeso.workers.dev' release-build-settings.txt
          grep -F 'QUAKESIGNAL_APP_ATTEST_MODE = production' release-build-settings.txt
          grep -F 'CODE_SIGN_ENTITLEMENTS = QuakeSignal/Supporting/QuakeSignal-Release.entitlements' release-build-settings.txt
          plutil -lint ios/QuakeSignal/Supporting/Info.plist \
            ios/QuakeSignal/Supporting/QuakeSignal-Release.entitlements
          test "$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' ios/QuakeSignal/Supporting/QuakeSignal-Release.entitlements)" = production
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.devicecheck.appattest-environment' ios/QuakeSignal/Supporting/QuakeSignal-Release.entitlements)" = production
          if grep -Fq 'QUAKESIGNAL_INTERNAL_QA' release-build-settings.txt; then
            echo "::error::Public Release must not compile the InternalQA capability"
            exit 1
          fi

          # Do not assume Xcode's product-location policy. Some developer
          # machines route products through a shared external cache even when
          # a derived-data path is supplied, while GitHub-hosted runners do
          # not. Ask the target for its actual output before auditing it.
          release_target_build_dir="$(xcodebuild -showBuildSettings \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath "$release_derived_data" | awk -F ' = ' '$1 ~ /TARGET_BUILD_DIR$/ { print $2; exit }')"
          release_app="$release_target_build_dir/QuakeSignal.app"
          if [ -z "$release_target_build_dir" ] || [ ! -d "$release_app" ]; then
            echo "::error::Could not locate the public Release app bundle"
            exit 1
          fi
          echo "RELEASE_APP=$release_app" >> "$GITHUB_ENV"

      - name: Build and test the production InternalQA configuration
        run: |
          set -euo pipefail
          set -o pipefail
          internal_qa_derived_data="$RUNNER_TEMP/quakesignal-ios-internal-qa-derived-data"
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration InternalQA \
            -destination "$IOS_DESTINATION" \
            -derivedDataPath "$internal_qa_derived_data" \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild-internal-qa.log

          xcodebuild -showBuildSettings \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration InternalQA \
            -sdk iphonesimulator > internal-qa-build-settings.txt
          grep -F 'PRODUCT_BUNDLE_IDENTIFIER = com.quakesignal.app' internal-qa-build-settings.txt
          grep -F 'QUAKESIGNAL_API_BASE_URL = https://quakesignal-api.hopeso.workers.dev' internal-qa-build-settings.txt
          grep -F 'QUAKESIGNAL_APP_ATTEST_MODE = production' internal-qa-build-settings.txt
          grep -F 'CODE_SIGN_ENTITLEMENTS = QuakeSignal/Supporting/QuakeSignal-Release.entitlements' internal-qa-build-settings.txt
          grep -F 'QUAKESIGNAL_INTERNAL_QA' internal-qa-build-settings.txt

          internal_qa_target_build_dir="$(xcodebuild -showBuildSettings \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration InternalQA \
            -sdk iphonesimulator \
            -derivedDataPath "$internal_qa_derived_data" | awk -F ' = ' '$1 ~ /TARGET_BUILD_DIR$/ { print $2; exit }')"
          internal_qa_app="$internal_qa_target_build_dir/QuakeSignal.app"
          if [ -z "$internal_qa_target_build_dir" ] || [ ! -d "$internal_qa_app" ]; then
            echo "::error::Could not locate the InternalQA app bundle"
            exit 1
          fi
          echo "INTERNAL_QA_APP=$internal_qa_app" >> "$GITHUB_ENV"

      - name: Verify the compiled public/InternalQA capability split
        run: |
          set -euo pipefail
          .github/scripts/verify-ios-build-split.sh "$RELEASE_APP" "$INTERNAL_QA_APP"

      - name: Upload Xcode test log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-xcodebuild-log
          path: |
            xcodebuild-test.log
            xcodebuild-release.log
            xcodebuild-internal-qa.log
            release-build-settings.txt
            internal-qa-build-settings.txt
          if-no-files-found: ignore

  generic-platform-builds:
    name: Unsigned Release (${{ matrix.name }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS/iPadOS
            key: ios
            scheme: QuakeSignal
            destination: generic/platform=iOS
          - name: Mac Catalyst
            key: maccatalyst
            scheme: QuakeSignal
            destination: generic/platform=macOS,variant=Mac Catalyst
          - name: tvOS
            key: tvos
            scheme: QuakeSignalTV
            destination: generic/platform=tvOS
          - name: visionOS
            key: visionos
            scheme: QuakeSignalVision
            destination: generic/platform=visionOS
          - name: watchOS
            key: watchos
            scheme: QuakeSignalWatch
            destination: generic/platform=watchOS

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install checksum-pinned XcodeGen
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen.zip"
          install_root="$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $archive" | shasum -a 256 -c -
          mkdir -p "$install_root"
          ditto -x -k "$archive" "$install_root"
          echo "$install_root/xcodegen/bin" >> "$GITHUB_PATH"
          "$install_root/xcodegen/bin/xcodegen" --version

      - name: Regenerate Xcode project and verify it is committed
        working-directory: ios
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          git diff --exit-code -- QuakeSignal.xcodeproj/project.pbxproj QuakeSignal.xcodeproj/xcshareddata/xcschemes
          test -z "$(git status --porcelain --untracked-files=all -- QuakeSignal.xcodeproj)"

      - name: Build credential-free generic Release target
        env:
          PLATFORM_KEY: ${{ matrix.key }}
          PLATFORM_SCHEME: ${{ matrix.scheme }}
          PLATFORM_DESTINATION: ${{ matrix.destination }}
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$PLATFORM_SCHEME" \
            -configuration Release \
            -destination "$PLATFORM_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/quakesignal-$PLATFORM_KEY-derived-data" \
            CODE_SIGNING_ALLOWED=NO | tee "xcodebuild-$PLATFORM_KEY-generic-release.log"

      - name: Upload generic build log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quakesignal-${{ matrix.key }}-generic-build-log
          path: xcodebuild-${{ matrix.key }}-generic-release.log
          if-no-files-found: ignore

  testflight:
    name: Archive iOS with embedded Watch and optionally upload to TestFlight
    needs:
      - test
      - generic-platform-builds
    # The signing lane is deliberately manual and only permitted from a
    # protected main ref. archive_only never makes an App Store Connect request.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.archive_only || inputs.upload_to_testflight) &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected
    runs-on: macos-latest
    environment:
      name: ios-app-store-release
    # Serialize against any policy-changing production Worker deployment. This
    # prevents a healthy early smoke from being invalidated before IPA upload.
    concurrency:
      group: quakesignal-production-app-attest-policy
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable signed source
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = TastyHeadphones/QuakeSignal
          test "$GITHUB_REF" = refs/heads/main
          test "$REF_PROTECTED" = true
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_COMMIT" = "$GITHUB_SHA"
          test "$(git rev-parse --verify HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      # Run before any certificate/profile/API-key materialization. A manual
      # archive must fail rather than override a mismatched source policy.
      - name: Verify iOS and Worker release contract
        id: release-contract
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: node .github/scripts/verify-ios-release-contract.mjs --build-number "$BUILD_NUMBER"

      # These two dependency-free Node scripts run directly from the checked
      # out tree, immediately after the static contract. Nothing capable of
      # mutating them runs before the production-origin proof.
      - name: Verify production notification origin readiness and contract
        working-directory: backend/cloudflare
        env:
          IOS_RELEASE_API_BASE_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          APP_ATTEST_POLICY_FINGERPRINT: ${{ steps.release-contract.outputs.app_attest_policy_fingerprint }}
        run: |
          set -euo pipefail
          if [ "$IOS_RELEASE_API_BASE_URL" != "https://quakesignal-api.hopeso.workers.dev" ]; then
            echo "::error::IOS_RELEASE_API_BASE_URL must be https://quakesignal-api.hopeso.workers.dev"
            exit 1
          fi
          node scripts/wait-for-worker-readiness.mjs "$IOS_RELEASE_API_BASE_URL"
          node scripts/smoke-test.mjs "$IOS_RELEASE_API_BASE_URL" \
            --expected-app-attest-policy-fingerprint "$APP_ATTEST_POLICY_FINGERPRINT" \
            --required-app-attest-bundle-version "$BUILD_NUMBER"

      - name: Install checksum-pinned XcodeGen
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen.zip"
          install_root="$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $archive" | shasum -a 256 -c -
          mkdir -p "$install_root"
          ditto -x -k "$archive" "$install_root"
          echo "$install_root/xcodegen/bin" >> "$GITHUB_PATH"
          "$install_root/xcodegen/bin/xcodegen" --version

      - name: Regenerate Xcode project and verify it is committed
        working-directory: ios
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          git diff --exit-code -- QuakeSignal.xcodeproj/project.pbxproj
          test -z "$(git status --porcelain --untracked-files=all -- QuakeSignal.xcodeproj)"

      - name: Validate protected signing configuration
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_APP_STORE_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_APP_STORE_CERTIFICATE_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_APP_STORE_PROVISIONING_PROFILE }}
          IOS_PROFILE_NAME: ${{ vars.IOS_APP_STORE_PROFILE_NAME }}
          WATCH_PROFILE: ${{ secrets.WATCHOS_APP_STORE_PROVISIONING_PROFILE }}
          WATCH_PROFILE_NAME: ${{ vars.WATCHOS_APP_STORE_PROFILE_NAME }}
          IOS_RELEASE_API_BASE_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
          ARCHIVE_ONLY: ${{ inputs.archive_only }}
          UPLOAD_TO_TESTFLIGHT: ${{ inputs.upload_to_testflight }}
        run: |
          set -euo pipefail
          if [ "$ARCHIVE_ONLY" = "true" ] && [ "$UPLOAD_TO_TESTFLIGHT" = "true" ]; then
            echo "::error::Choose either archive_only or upload_to_testflight, not both"
            exit 1
          fi
          if [ "$ARCHIVE_ONLY" != "true" ] && [ "$UPLOAD_TO_TESTFLIGHT" != "true" ]; then
            echo "::error::Choose archive_only or upload_to_testflight"
            exit 1
          fi
          required=(
            IOS_CERTIFICATE
            IOS_CERTIFICATE_PASSWORD
            IOS_PROFILE
            IOS_PROFILE_NAME
            WATCH_PROFILE
            WATCH_PROFILE_NAME
            IOS_RELEASE_API_BASE_URL
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::ios-app-store-release is missing: $(IFS=,; echo "${missing[*]}")"
            exit 1
          fi
          if [ "$IOS_RELEASE_API_BASE_URL" != "https://quakesignal-api.hopeso.workers.dev" ]; then
            echo "::error::IOS_RELEASE_API_BASE_URL must be https://quakesignal-api.hopeso.workers.dev"
            exit 1
          fi

      - name: Validate App Store Connect upload configuration
        if: ${{ inputs.upload_to_testflight && !inputs.archive_only }}
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER: ${{ vars.APP_STORE_CONNECT_API_ISSUER }}
        run: |
          set -euo pipefail
          required=(
            APP_STORE_CONNECT_KEY
            APP_STORE_CONNECT_KEY_ID
            APP_STORE_CONNECT_ISSUER
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::ios-app-store-release is missing: $(IFS=,; echo "${missing[*]}")"
            exit 1
          fi

      - name: Import Apple Distribution certificate and App Store profiles
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_APP_STORE_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_APP_STORE_CERTIFICATE_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_APP_STORE_PROVISIONING_PROFILE }}
          WATCH_PROFILE: ${{ secrets.WATCHOS_APP_STORE_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/quakesignal-ios.keychain-db"
          certificate="$RUNNER_TEMP/quakesignal-ios-distribution.p12"
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          profile="$profile_dir/quakesignal-ios.mobileprovision"
          watch_profile="$profile_dir/quakesignal-watch.mobileprovision"
          keychain_password="$(uuidgen)"

          printf '%s' "$IOS_CERTIFICATE" | base64 -D > "$certificate"
          mkdir -p "$profile_dir"
          printf '%s' "$IOS_PROFILE" | base64 -D > "$profile"
          printf '%s' "$WATCH_PROFILE" | base64 -D > "$watch_profile"
          chmod 600 "$certificate" "$profile" "$watch_profile"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security import "$certificate" -k "$keychain" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security find-identity -v -p codesigning "$keychain"

      - name: Archive signed App Store build
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          IOS_PROFILE_NAME: ${{ vars.IOS_APP_STORE_PROFILE_NAME }}
          WATCH_PROFILE_NAME: ${{ vars.WATCHOS_APP_STORE_PROFILE_NAME }}
          IOS_RELEASE_API_BASE_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
        # The preceding release-contract step validates the dispatch input
        # against the checked-in Xcode/Worker policy before any signing secret
        # is materialized. Keep this as one folded, direct command: the static
        # verifier can then bind every archive argument to the executable
        # command rather than infer safety from unrelated shell text.
        run: >-
          xcodebuild archive
          -project "$XCODE_PROJECT"
          -scheme "$XCODE_SCHEME"
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/QuakeSignal.xcarchive"
          DEVELOPMENT_TEAM=5TT564H883
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY='Apple Distribution'
          QUAKESIGNAL_IOS_PROFILE_NAME="$IOS_PROFILE_NAME"
          QUAKESIGNAL_WATCH_PROFILE_NAME="$WATCH_PROFILE_NAME"
          CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          QUAKESIGNAL_API_BASE_URL="$IOS_RELEASE_API_BASE_URL"

      - name: Export App Store Connect IPA
        env:
          IOS_PROFILE_NAME: ${{ vars.IOS_APP_STORE_PROFILE_NAME }}
          WATCH_PROFILE_NAME: ${{ vars.WATCHOS_APP_STORE_PROFILE_NAME }}
        run: |
          set -euo pipefail
          export_options="$RUNNER_TEMP/QuakeSignal-ExportOptions.plist"
          export_path="$RUNNER_TEMP/QuakeSignal-export"
          cp ios/AppStore/ExportOptions.plist "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.quakesignal.app string $IOS_PROFILE_NAME" "$export_options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.quakesignal.app.watchkitapp string $WATCH_PROFILE_NAME" "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :manageAppVersionAndBuildNumber bool false' "$export_options"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/QuakeSignal.xcarchive" \
            -exportOptionsPlist "$export_options" \
            -exportPath "$export_path"
          shopt -s nullglob
          ipas=("$export_path"/*.ipa)
          unexpected=("$export_path"/*.pkg)
          if [ "${#ipas[@]}" -ne 1 ] || [ "${#unexpected[@]}" -ne 0 ] || [ ! -f "${ipas[0]:-}" ] || [ -L "${ipas[0]:-}" ]; then
            echo "::error::Expected exactly one regular non-symlink exported iOS IPA and no PKG"
            exit 1
          fi
          echo "IPA_PATH=${ipas[0]}" >> "$GITHUB_ENV"
          echo 'IPA_VERIFIED=false' >> "$GITHUB_ENV"

      - name: Verify signed iOS archive and exported IPA
        shell: bash
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          IOS_PROFILE_NAME: ${{ vars.IOS_APP_STORE_PROFILE_NAME }}
          WATCH_PROFILE_NAME: ${{ vars.WATCHOS_APP_STORE_PROFILE_NAME }}
        run: |
          set -euo pipefail
          ios/ci_scripts/verify-signed-apple-artifacts.sh \
            --platform ios \
            --archive "$RUNNER_TEMP/QuakeSignal.xcarchive" \
            --exported "${IPA_PATH:?IPA_PATH is not set after export}" \
            --build-number "$BUILD_NUMBER" \
            --marketing-version 1.2 \
            --team-id 5TT564H883 \
            --archive-signing strict-distribution \
            --host-profile-name "$IOS_PROFILE_NAME" \
            --watch-profile-name "$WATCH_PROFILE_NAME"
          ipa_sha256="$(/usr/bin/shasum -a 256 "$IPA_PATH")"
          ipa_sha256="${ipa_sha256%% *}"
          if [[ ! "$ipa_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Verified iOS IPA did not produce a valid SHA-256 digest"
            exit 1
          fi
          echo "IPA_SHA256=$ipa_sha256" >> "$GITHUB_ENV"
          printf 'Verified `%s` SHA-256: `%s`\n' "${IPA_PATH##*/}" "$ipa_sha256" >> "$GITHUB_STEP_SUMMARY"
          echo 'IPA_VERIFIED=true' >> "$GITHUB_ENV"

      - name: Upload build to TestFlight
        if: ${{ inputs.upload_to_testflight && !inputs.archive_only }}
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          IOS_ALTOOL_PLATFORM: ios
          APP_STORE_CONNECT_APPLE_ID: "6800642443"
          IOS_BUNDLE_IDENTIFIER: com.quakesignal.app
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER: ${{ vars.APP_STORE_CONNECT_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ "${IPA_VERIFIED:-false}" != true ]; then
            echo "::error::Refusing to upload an iOS IPA that did not pass signed verification"
            exit 1
          fi
          upload_sha256="$(/usr/bin/shasum -a 256 "${IPA_PATH:?IPA_PATH is not set after export}")"
          upload_sha256="${upload_sha256%% *}"
          if [ "$upload_sha256" != "${IPA_SHA256:?Verified iOS IPA SHA-256 is missing}" ]; then
            echo "::error::iOS IPA changed after signed verification"
            exit 1
          fi
          key_dir="$RUNNER_TEMP/appstore-private-keys"
          key_path="$key_dir/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          mkdir -p "$key_dir"
          cleanup() {
            rm -f "$key_path"
            rmdir "$key_dir" 2>/dev/null || true
          }
          trap cleanup EXIT
          printf '%s' "$APP_STORE_CONNECT_KEY" > "$key_path"
          chmod 600 "$key_path"
          export API_PRIVATE_KEYS_DIR="$key_dir"
          upload_arguments=(
            --platform "$IOS_ALTOOL_PLATFORM"
            --apple-id "$APP_STORE_CONNECT_APPLE_ID"
            --bundle-id "$IOS_BUNDLE_IDENTIFIER"
            --bundle-version "$BUILD_NUMBER"
            --bundle-short-version-string 1.2
            --api-key "$APP_STORE_CONNECT_KEY_ID"
            --api-issuer "$APP_STORE_CONNECT_ISSUER"
            --output-format json
          )
          xcrun altool --validate-app "$IPA_PATH" "${upload_arguments[@]}"
          xcrun altool --upload-package "$IPA_PATH" "${upload_arguments[@]}"

      - name: Add TestFlight build to all tester groups
        if: ${{ inputs.upload_to_testflight && !inputs.archive_only }}
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          MARKETING_VERSION: "1.2"
          APP_STORE_CONNECT_APPLE_ID: "6800642443"
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER: ${{ vars.APP_STORE_CONNECT_API_ISSUER }}
        run: node .github/scripts/assign-testflight-groups.mjs

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/quakesignal-ios-distribution.p12"
          rm -f "$RUNNER_TEMP/QuakeSignal-ExportOptions.plist"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/quakesignal-ios.mobileprovision"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/quakesignal-watch.mobileprovision"
          rmdir "$RUNNER_TEMP/appstore-private-keys" 2>/dev/null || true
          security delete-keychain "$RUNNER_TEMP/quakesignal-ios.keychain-db" 2>/dev/null || true

      - name: Write signed release attestation
        env:
          ARCHIVE_ONLY: ${{ inputs.archive_only }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          test "${IPA_VERIFIED:-false}" = true
          attestation_root="$RUNNER_TEMP/signed-release-attestation-ios-ipados-watchos"
          mkdir -m 700 "$attestation_root"
          ATTESTATION_PATH="$attestation_root/signed-release-attestation.json" \
            /usr/bin/ruby -rjson -rtime -e '
              build = Integer(ENV.fetch("BUILD_NUMBER"), 10)
              abort "signed release attestation requires build 22" unless build == 22
              sha256 = ENV.fetch("IPA_SHA256")
              abort "signed release attestation requires a valid IPA SHA-256" unless sha256.match?(/\A[0-9a-f]{64}\z/)
              attestation = {
                "schemaVersion" => 1,
                "repository" => ENV.fetch("GITHUB_REPOSITORY"),
                "workflowFile" => ".github/workflows/ios.yml",
                "runId" => Integer(ENV.fetch("GITHUB_RUN_ID"), 10),
                "runAttempt" => Integer(ENV.fetch("GITHUB_RUN_ATTEMPT"), 10),
                "event" => ENV.fetch("GITHUB_EVENT_NAME"),
                "headBranch" => ENV.fetch("GITHUB_REF_NAME"),
                "headSha" => ENV.fetch("GITHUB_SHA"),
                "sourceCommit" => ENV.fetch("SOURCE_COMMIT"),
                "marketingVersion" => "1.2",
                "buildNumber" => build,
                "distributionMode" => ENV.fetch("ARCHIVE_ONLY") == "true" ? "archive-only" : "testflight-upload",
                "platforms" => %w[ios-ipados watchos],
                "artifact" => { "kind" => "ipa", "sha256" => sha256 },
                "attestedAtUtc" => Time.now.utc.iso8601,
              }
              abort "attestation source is not the run head" unless
                attestation.fetch("sourceCommit") == attestation.fetch("headSha")
              File.open(ENV.fetch("ATTESTATION_PATH"), File::WRONLY | File::CREAT | File::EXCL, 0o600) do |file|
                file.write(JSON.pretty_generate(attestation) + "\n")
              end
            '

      - name: Upload signed release attestation only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-release-attestation-ios-ipados-watchos-${{ inputs.source_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signed-release-attestation-ios-ipados-watchos/signed-release-attestation.json
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          overwrite: false
          retention-days: 30

  testflight-groups:
    name: Add TestFlight build to all tester groups
    if: github.event_name == 'workflow_dispatch' && inputs.assign_testflight_groups && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: macos-latest
    environment:
      name: ios-app-store-release
    concurrency:
      group: quakesignal-production-app-attest-policy
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable signed source
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = TastyHeadphones/QuakeSignal
          test "$GITHUB_REF" = refs/heads/main
          test "$REF_PROTECTED" = true
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_COMMIT" = "$GITHUB_SHA"
          test "$(git rev-parse --verify HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Verify iOS and Worker release contract
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: node .github/scripts/verify-ios-release-contract.mjs --build-number "$BUILD_NUMBER"

      - name: Add TestFlight build to all tester groups
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          MARKETING_VERSION: "1.2"
          APP_STORE_CONNECT_APPLE_ID: "6800642443"
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER: ${{ vars.APP_STORE_CONNECT_API_ISSUER }}
        run: node .github/scripts/assign-testflight-groups.mjs
