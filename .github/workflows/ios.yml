name: iOS

on:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      archive_only:
        description: Archive, export, and validate a signed IPA without uploading it to App Store Connect
        required: false
        default: false
        type: boolean
      upload_to_testflight:
        description: Archive, sign, and upload a new build to TestFlight
        required: false
        default: false
        type: boolean
      build_number:
        description: Exact pre-approved CFBundleVersion from ios/project.yml and the Worker App Attest allow-list
        required: false
        default: "1"
        type: string

concurrency:
  # A manual signed archive or TestFlight upload must not be cancelled by an
  # ordinary main push.
  # CI runs remain coalesced by ref, while dispatches use an isolated lane.
  group: ios-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  XCODE_PROJECT: ios/QuakeSignal.xcodeproj
  XCODE_SCHEME: QuakeSignal
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  test:
    name: Build and test iOS
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install checksum-pinned XcodeGen
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen.zip"
          install_root="$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $archive" | shasum -a 256 -c -
          mkdir -p "$install_root"
          ditto -x -k "$archive" "$install_root"
          echo "$install_root/xcodegen/bin" >> "$GITHUB_PATH"
          "$install_root/xcodegen/bin/xcodegen" --version

      - name: Regenerate Xcode project and verify it is committed
        working-directory: ios
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          git diff --exit-code -- QuakeSignal.xcodeproj/project.pbxproj
          test -z "$(git status --porcelain --untracked-files=all -- QuakeSignal.xcodeproj)"

      - name: Select an installed iOS simulator
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available -j | ruby -rjson -e '
            runtimes = JSON.parse(STDIN.read).fetch("devices")
            devices = runtimes
              .select { |runtime, _| runtime.include?(".iOS-") }
              .values
              .flatten
              .select { |device| device["isAvailable"] }
            abort "No available iOS Simulator" if devices.empty?
            puts devices.first.fetch("udid")
          ')"
          echo "IOS_DESTINATION=platform=iOS Simulator,id=$simulator_id" >> "$GITHUB_ENV"

      - name: Build and run unit tests on an iOS simulator
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination "$IOS_DESTINATION" \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild-test.log

      - name: Build and verify the unsigned Release configuration
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "$IOS_DESTINATION" \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild-release.log

          xcodebuild -showBuildSettings \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphonesimulator > release-build-settings.txt
          grep -F 'PRODUCT_BUNDLE_IDENTIFIER = com.quakesignal.app' release-build-settings.txt
          grep -F 'QUAKESIGNAL_API_BASE_URL = https://quakesignal-api.hopeso.workers.dev' release-build-settings.txt
          grep -F 'QUAKESIGNAL_APP_ATTEST_MODE = production' release-build-settings.txt
          grep -F 'CODE_SIGN_ENTITLEMENTS = QuakeSignal/Supporting/QuakeSignal-Release.entitlements' release-build-settings.txt
          plutil -lint ios/QuakeSignal/Supporting/Info.plist \
            ios/QuakeSignal/Supporting/QuakeSignal-Release.entitlements
          test "$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' ios/QuakeSignal/Supporting/QuakeSignal-Release.entitlements)" = production
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.devicecheck.appattest-environment' ios/QuakeSignal/Supporting/QuakeSignal-Release.entitlements)" = production

      - name: Upload Xcode test log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-xcodebuild-log
          path: |
            xcodebuild-test.log
            xcodebuild-release.log
            release-build-settings.txt
          if-no-files-found: ignore

  testflight:
    name: Archive and optionally upload TestFlight build
    needs: test
    # The signing lane is deliberately manual and only permitted from a
    # protected main ref. archive_only never makes an App Store Connect request.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.archive_only || inputs.upload_to_testflight) &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected
    runs-on: macos-latest
    environment:
      name: ios-app-store-release

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install checksum-pinned XcodeGen
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen.zip"
          install_root="$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $archive" | shasum -a 256 -c -
          mkdir -p "$install_root"
          ditto -x -k "$archive" "$install_root"
          echo "$install_root/xcodegen/bin" >> "$GITHUB_PATH"
          "$install_root/xcodegen/bin/xcodegen" --version

      # Keep the production-origin check below independent from the signing
      # material: install the immutable Worker test dependencies before any
      # certificate, profile, or App Store Connect secret is exposed.
      - name: Set up Node.js for production Worker smoke
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/cloudflare/package-lock.json

      - name: Install Worker smoke-test dependencies
        working-directory: backend/cloudflare
        run: npm ci

      - name: Regenerate Xcode project and verify it is committed
        working-directory: ios
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          git diff --exit-code -- QuakeSignal.xcodeproj/project.pbxproj
          test -z "$(git status --porcelain --untracked-files=all -- QuakeSignal.xcodeproj)"

      - name: Validate protected signing configuration
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_APP_STORE_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_APP_STORE_CERTIFICATE_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_APP_STORE_PROVISIONING_PROFILE }}
          IOS_PROFILE_NAME: ${{ vars.IOS_APP_STORE_PROFILE_NAME }}
          IOS_RELEASE_API_BASE_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
          ARCHIVE_ONLY: ${{ inputs.archive_only }}
          UPLOAD_TO_TESTFLIGHT: ${{ inputs.upload_to_testflight }}
        run: |
          set -euo pipefail
          if [ "$ARCHIVE_ONLY" = "true" ] && [ "$UPLOAD_TO_TESTFLIGHT" = "true" ]; then
            echo "::error::Choose either archive_only or upload_to_testflight, not both"
            exit 1
          fi
          if [ "$ARCHIVE_ONLY" != "true" ] && [ "$UPLOAD_TO_TESTFLIGHT" != "true" ]; then
            echo "::error::Choose archive_only or upload_to_testflight"
            exit 1
          fi
          required=(
            IOS_CERTIFICATE
            IOS_CERTIFICATE_PASSWORD
            IOS_PROFILE
            IOS_PROFILE_NAME
            IOS_RELEASE_API_BASE_URL
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::ios-app-store-release is missing: $(IFS=,; echo "${missing[*]}")"
            exit 1
          fi
          if [ "$IOS_RELEASE_API_BASE_URL" != "https://quakesignal-api.hopeso.workers.dev" ]; then
            echo "::error::IOS_RELEASE_API_BASE_URL must be https://quakesignal-api.hopeso.workers.dev"
            exit 1
          fi

      - name: Validate App Store Connect upload configuration
        if: ${{ inputs.upload_to_testflight && !inputs.archive_only }}
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER: ${{ vars.APP_STORE_CONNECT_API_ISSUER }}
        run: |
          set -euo pipefail
          required=(
            APP_STORE_CONNECT_KEY
            APP_STORE_CONNECT_KEY_ID
            APP_STORE_CONNECT_ISSUER
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::ios-app-store-release is missing: $(IFS=,; echo "${missing[*]}")"
            exit 1
          fi

      - name: Verify production notification origin readiness and contract
        working-directory: backend/cloudflare
        env:
          IOS_RELEASE_API_BASE_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
        run: |
          set -euo pipefail
          # A newly deployed Worker may need the bounded 90-second Wolfx HTTP
          # fallback grace before it becomes fully ready. Require the complete
          # APNs/upstream contract rather than accepting a superficial 200.
          npm run wait:worker-readiness -- "$IOS_RELEASE_API_BASE_URL"
          # A legacy Worker can return a superficial 200 from /healthz while
          # lacking App Attest, delivery readiness, and the App Store legal
          # routes. Require the full production smoke contract before signing
          # an archive for TestFlight or App Review.
          npm run test:remote -- "$IOS_RELEASE_API_BASE_URL"

      - name: Import Apple Distribution certificate and App Store profile
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_APP_STORE_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_APP_STORE_CERTIFICATE_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_APP_STORE_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/quakesignal-ios.keychain-db"
          certificate="$RUNNER_TEMP/quakesignal-ios-distribution.p12"
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          profile="$profile_dir/quakesignal-ios.mobileprovision"
          keychain_password="$(uuidgen)"

          printf '%s' "$IOS_CERTIFICATE" | base64 -D > "$certificate"
          mkdir -p "$profile_dir"
          printf '%s' "$IOS_PROFILE" | base64 -D > "$profile"
          chmod 600 "$certificate" "$profile"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security import "$certificate" -k "$keychain" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security find-identity -v -p codesigning "$keychain"

      - name: Archive signed App Store build
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          IOS_PROFILE_NAME: ${{ vars.IOS_APP_STORE_PROFILE_NAME }}
          IOS_RELEASE_API_BASE_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
        run: |
          set -euo pipefail
          if [[ ! "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::build_number must contain only digits"
            exit 1
          fi
          if [ "$BUILD_NUMBER" != "1" ]; then
            echo "::error::Update ios/project.yml and APP_ATTEST_ALLOWED_BUNDLE_VERSIONS in the reviewed Worker release before using a new CFBundleVersion"
            exit 1
          fi
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/QuakeSignal.xcarchive" \
            DEVELOPMENT_TEAM=5TT564H883 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            QUAKESIGNAL_API_BASE_URL="$IOS_RELEASE_API_BASE_URL"

      - name: Export App Store Connect IPA
        env:
          IOS_PROFILE_NAME: ${{ vars.IOS_APP_STORE_PROFILE_NAME }}
        run: |
          set -euo pipefail
          export_options="$RUNNER_TEMP/QuakeSignal-ExportOptions.plist"
          cp ios/AppStore/ExportOptions.plist "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.quakesignal.app string $IOS_PROFILE_NAME" "$export_options"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/QuakeSignal.xcarchive" \
            -exportOptionsPlist "$export_options" \
            -exportPath "$RUNNER_TEMP/QuakeSignal-export"
          ipa=("$RUNNER_TEMP/QuakeSignal-export"/*.ipa)
          if [ "${#ipa[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one exported IPA"
            exit 1
          fi
          echo "IPA_PATH=${ipa[0]}" >> "$GITHUB_ENV"

      - name: Verify signed iOS archive and exported IPA
        shell: bash
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          IOS_PROFILE_NAME: ${{ vars.IOS_APP_STORE_PROFILE_NAME }}
        run: |
          set -euo pipefail
          expected_team="5TT564H883"
          expected_bundle_identifier="com.quakesignal.app"
          expected_application_identifier="$expected_team.$expected_bundle_identifier"
          archive="$RUNNER_TEMP/QuakeSignal.xcarchive"
          verification_dir="$(mktemp -d "$RUNNER_TEMP/quakesignal-ios-signing.XXXXXX")"
          trap 'rm -rf "$verification_dir"' EXIT

          assert_plist_value() {
            local plist="$1"
            local key="$2"
            local expected="$3"
            local label="$4"
            local actual

            if ! actual="$(/usr/libexec/PlistBuddy -c "Print :$key" "$plist" 2>/dev/null)"; then
              echo "::error::$label is missing required key $key"
              return 1
            fi
            if [ "$actual" != "$expected" ]; then
              echo "::error::$label has an unexpected value for $key"
              return 1
            fi
          }

          assert_plist_array_contains() {
            local plist="$1"
            local key="$2"
            local expected="$3"
            local label="$4"
            local index=0
            local actual

            while actual="$(/usr/libexec/PlistBuddy -c "Print :$key:$index" "$plist" 2>/dev/null)"; do
              if [ "$actual" = "$expected" ]; then
                return 0
              fi
              index=$((index + 1))
            done

            echo "::error::$label does not include required value $expected for $key"
            return 1
          }

          verify_ios_app() {
            local label="$1"
            local app="$2"
            local entitlements="$verification_dir/$label-entitlements.plist"
            local profile="$app/embedded.mobileprovision"
            local profile_plist="$verification_dir/$label-profile.plist"

            if [ ! -d "$app" ]; then
              echo "::error::$label app bundle is missing"
              return 1
            fi
            if [ ! -f "$app/Info.plist" ] || [ ! -f "$profile" ]; then
              echo "::error::$label is missing Info.plist or embedded.mobileprovision"
              return 1
            fi

            codesign --verify --deep --strict --verbose=2 "$app"
            if ! codesign -dvv "$app" 2>&1 | grep -Fqx "TeamIdentifier=$expected_team"; then
              echo "::error::$label is not signed for the expected Apple team"
              return 1
            fi
            if ! codesign -dvv "$app" 2>&1 | grep -Fq 'Authority=Apple Distribution'; then
              echo "::error::$label is not signed with an Apple Distribution identity"
              return 1
            fi

            plutil -lint "$app/Info.plist" >/dev/null
            assert_plist_value "$app/Info.plist" "CFBundleIdentifier" "$expected_bundle_identifier" "$label Info.plist"
            assert_plist_value "$app/Info.plist" "CFBundleVersion" "$BUILD_NUMBER" "$label Info.plist"

            codesign -d --entitlements :- "$app" > "$entitlements" 2>/dev/null
            plutil -lint "$entitlements" >/dev/null
            assert_plist_value "$entitlements" "application-identifier" "$expected_application_identifier" "$label signed entitlements"
            assert_plist_value "$entitlements" "com.apple.developer.team-identifier" "$expected_team" "$label signed entitlements"
            assert_plist_value "$entitlements" "aps-environment" "production" "$label signed entitlements"
            assert_plist_value "$entitlements" "com.apple.developer.devicecheck.appattest-environment" "production" "$label signed entitlements"
            assert_plist_value "$entitlements" "com.apple.developer.usernotifications.time-sensitive" "true" "$label signed entitlements"

            security cms -D -i "$profile" > "$profile_plist"
            plutil -lint "$profile_plist" >/dev/null
            assert_plist_value "$profile_plist" "Name" "$IOS_PROFILE_NAME" "$label provisioning profile"
            assert_plist_value "$profile_plist" "ApplicationIdentifierPrefix:0" "$expected_team" "$label provisioning profile"
            assert_plist_value "$profile_plist" "TeamIdentifier:0" "$expected_team" "$label provisioning profile"
            assert_plist_value "$profile_plist" "Entitlements:application-identifier" "$expected_application_identifier" "$label provisioning profile"
            assert_plist_value "$profile_plist" "Entitlements:com.apple.developer.team-identifier" "$expected_team" "$label provisioning profile"
            assert_plist_value "$profile_plist" "Entitlements:aps-environment" "production" "$label provisioning profile"
            # Apple profiles authorize both App Attest environments as an array;
            # the signed application entitlement above is still required to be production.
            assert_plist_array_contains "$profile_plist" "Entitlements:com.apple.developer.devicecheck.appattest-environment" "production" "$label provisioning profile"
            assert_plist_value "$profile_plist" "Entitlements:com.apple.developer.usernotifications.time-sensitive" "true" "$label provisioning profile"
          }

          shopt -s nullglob
          archive_apps=("$archive"/Products/Applications/*.app)
          if [ "${#archive_apps[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one app in the signed archive"
            exit 1
          fi

          ipa_path="${IPA_PATH:?IPA_PATH is not set after export}"
          if [ ! -f "$ipa_path" ]; then
            echo "::error::Exported IPA is missing"
            exit 1
          fi
          ipa_root="$verification_dir/ipa"
          mkdir -p "$ipa_root"
          ditto -x -k "$ipa_path" "$ipa_root"
          ipa_apps=("$ipa_root"/Payload/*.app)
          if [ "${#ipa_apps[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one app in the exported IPA"
            exit 1
          fi

          verify_ios_app "archive" "${archive_apps[0]}"
          verify_ios_app "ipa" "${ipa_apps[0]}"

      - name: Upload build to TestFlight
        if: ${{ inputs.upload_to_testflight && !inputs.archive_only }}
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER: ${{ vars.APP_STORE_CONNECT_API_ISSUER }}
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/appstore-private-keys"
          key_path="$key_dir/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          mkdir -p "$key_dir"
          cleanup() {
            rm -f "$key_path"
            rmdir "$key_dir" 2>/dev/null || true
          }
          trap cleanup EXIT
          printf '%s' "$APP_STORE_CONNECT_KEY" > "$key_path"
          chmod 600 "$key_path"
          export API_PRIVATE_KEYS_DIR="$key_dir"
          xcrun altool --upload-package "$IPA_PATH" \
            --api-key "$APP_STORE_CONNECT_KEY_ID" \
            --api-issuer "$APP_STORE_CONNECT_ISSUER" \
            --output-format json

      - name: Upload IPA as a private workflow artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quakesignal-ios-app-store-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/quakesignal-ios-distribution.p12"
          rm -f "$RUNNER_TEMP/QuakeSignal-ExportOptions.plist"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/quakesignal-ios.mobileprovision"
          rmdir "$RUNNER_TEMP/appstore-private-keys" 2>/dev/null || true
          security delete-keychain "$RUNNER_TEMP/quakesignal-ios.keychain-db" 2>/dev/null || true
